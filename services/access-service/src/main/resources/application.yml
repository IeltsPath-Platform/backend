server:
  port: ${SERVER_PORT:8084}

access:
  points:
    daily-earn-limit: ${ACCESS_POINTS_DAILY_EARN_LIMIT:20}

spring:
  application:
    name: access-service
  config:
    import:
      - optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
      - optional:file:./.env[.properties]
      - optional:file:../../.env[.properties]
