# The scheduled jobs are on in the application. Tests drive the relay and the expiry scan themselves, so those two are off
# unless a test switches them on. The lapse job and the user deletion worker cannot be switched off: they run once when a
# test starts the whole application, and the worker is slowed down so it does not keep polling afterwards.
access.outbox.relay.enabled=false
access.subscription-expiry.enabled=false
access.user-deletion.poll-delay-ms=3600000
