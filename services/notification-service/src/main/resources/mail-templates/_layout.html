<!-- Shared header and footer for every HTML email. Included with th:replace from each body.html. -->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="header">
  <div style="font-family:Arial,Helvetica,sans-serif;max-width:560px;margin:0 auto;color:#1f2937;line-height:1.6">
    <h2 style="color:#0b1f5c;margin:24px 0 8px">IELTSPath</h2>
</th:block>

<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="footer">
    <p style="color:#6b7280;font-size:12px;margin-top:32px">Email này được gửi tự động từ IELTSPath. Nếu bạn cần hỗ trợ, hãy trả lời email này.</p>
  </div>
</th:block>
