<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Xác minh địa chỉ email của bạn trên IELTSPath</title>
</head>
<body>
<th:block th:replace="~{_layout :: header}"></th:block>
  <p>Xin chào <span th:text="${displayName}">bạn</span>,</p>
  <p>Cảm ơn bạn đã đăng ký IELTSPath. Dùng liên kết sau để xác minh email trong vòng <span th:text="${expiresInMinutes}">60</span> phút:</p>
  <p><a th:href="${verifyLink}">Xác minh email</a></p>
  <p>Nếu bạn không đăng ký tài khoản, hãy bỏ qua email này.</p>
<th:block th:replace="~{_layout :: footer}"></th:block>
</body>
</html>
