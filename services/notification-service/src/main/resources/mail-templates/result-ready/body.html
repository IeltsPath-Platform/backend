<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kết quả bài thi của bạn đã có</title>
</head>
<body>
<th:block th:replace="~{_layout :: header}"></th:block>
  <p>Xin chào <span th:text="${displayName}">bạn</span>,</p>
  <p>Kết quả bài đầu vào hoặc bài thi thử của bạn đã được chấm xong. Xem band và phân tích chi tiết.</p>
  <p><a th:href="${actionLink}">Xem kết quả</a></p>
  <p style="font-size:12px;color:#6b7280">Bạn có thể <a th:href="${unsubscribeLink}">tắt email học tập</a> bất cứ lúc nào.</p>
<th:block th:replace="~{_layout :: footer}"></th:block>
</body>
</html>
