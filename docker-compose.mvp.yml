# MVP main learner flow in containers: auth → lessons/reviews (learning) → final test (assessment)
# → AssessmentCompleted.v2 over RabbitMQ → learning opens the next topic; Writing grading debits access points.
# Library, game, community and notification are not part of this stack.
#
#   docker compose -f docker-compose.mvp.yml up -d --build
#   Gateway:    http://localhost:8080   (Swagger UI: /swagger-ui.html)
#   Eureka:     http://localhost:8761   RabbitMQ UI: http://localhost:15673   Postgres: localhost:5440
#
# Required in .env: POSTGRES_PASSWORD, RABBITMQ_USERNAME, RABBITMQ_PASSWORD, EXTERNAL_JWT_SECRET,
# GATEWAY_INTERNAL_JWT_SECRET. Optional: LEARNING_LLM_* (Writing grading), CONTENT_MEDIA_BASE_URL (Listening audio).
# Passwords are fixed when a volume is first created; after changing them, remove the volumes (down -v).
# Host ports clash with services started from the IDE; override with MVP_GATEWAY_PORT, MVP_EUREKA_PORT,
# MVP_POSTGRES_PORT, MVP_RABBITMQ_UI_PORT.
name: ieltspath-mvp

x-spring-service: &spring-service
  restart: unless-stopped
  networks:
    - mvp-network
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT}/actuator/health | grep -q UP"]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 30s

x-spring-env: &spring-env
  SPRING_CLOUD_CONFIG_URI: http://config-server:8888
  EUREKA_URL: http://eureka-server:8761/eureka/
  GATEWAY_INTERNAL_JWT_SECRET: "${GATEWAY_INTERNAL_JWT_SECRET:?Set GATEWAY_INTERNAL_JWT_SECRET}"
  API_DOCS_ENABLED: "${API_DOCS_ENABLED:-true}"
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx512m"

x-after-infra: &after-infra
  postgres:
    condition: service_healthy
  config-server:
    condition: service_healthy
  eureka-server:
    condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:${MVP_POSTGRES_PORT:-5440}:5432"
    networks:
      - mvp-network
    volumes:
      - mvp-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/mvp-init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}"
    ports:
      - "127.0.0.1:${MVP_RABBITMQ_UI_PORT:-15673}:15672"
    networks:
      - mvp-network
    volumes:
      - mvp-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12

  config-server:
    <<: *spring-service
    build:
      context: .
      dockerfile: Dockerfile.spring-service
      args:
        MODULE_PATH: infra/config-server
    environment:
      SERVER_PORT: 8888
      CONFIG_NATIVE_REPO_URI: file:/config-repo
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    volumes:
      - ./infra/config-server/config-repo:/config-repo:ro

  eureka-server:
    <<: *spring-service
    build:
      context: .
      dockerfile: Dockerfile.spring-service
      args:
        MODULE_PATH: infra/eureka-server
    environment:
      <<: *spring-env
      SERVER_PORT: 8761
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    ports:
      - "127.0.0.1:${MVP_EUREKA_PORT:-8761}:8761"
    depends_on:
      config-server:
        condition: service_healthy

  api-gateway:
    <<: *spring-service
    build:
      context: .
      dockerfile: Dockerfile.spring-service
      args:
        MODULE_PATH: infra/api-gateway
    environment:
      <<: *spring-env
      SERVER_PORT: 8080
      EXTERNAL_JWT_SECRET: "${EXTERNAL_JWT_SECRET:?Set EXTERNAL_JWT_SECRET}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:5173}"
    ports:
      - "127.0.0.1:${MVP_GATEWAY_PORT:-8080}:8080"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  user-service:
    <<: *spring-service
    build:
      context: .
      dockerfile: Dockerfile.spring-service
      args:
        MODULE_PATH: services/user-service
    environment:
      <<: *spring-env
      SERVER_PORT: 8085
      EXTERNAL_JWT_SECRET: "${EXTERNAL_JWT_SECRET:?Set EXTERNAL_JWT_SECRET}"
      USER_DB_URL: jdbc:postgresql://postgres:5432/user_db
      USER_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      # Demo accounts (learner/admin@ielts.demo, Demo@123) after Flyway; set false for a clean database.
      DEMO_DATA_ENABLED: "${DEMO_DATA_ENABLED:-true}"
    depends_on: *after-infra

  content-service:
    <<: *spring-service
    build:
      context: .
      dockerfile: Dockerfile.spring-service
      args:
        MODULE_PATH: services/content-service
    environment:
      <<: *spring-env
      SERVER_PORT: 8082
      CONTENT_DB_URL: jdbc:postgresql://postgres:5432/content_db
      CONTENT_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      # Placeholder keeps Listening lessons working (URLs are well-formed but not playable) until the mp3 bucket exists.
      CONTENT_MEDIA_BASE_URL: "${CONTENT_MEDIA_BASE_URL:-https://media.example.invalid/}"
    depends_on: *after-infra

  access-service:
    <<: *spring-service
    build:
      context: .
      dockerfile: Dockerfile.spring-service
      args:
        MODULE_PATH: services/access-service
    environment:
      <<: *spring-env
      SERVER_PORT: 8084
      ACCESS_DB_URL: jdbc:postgresql://postgres:5432/access_db
      ACCESS_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      DEMO_DATA_ENABLED: "${DEMO_DATA_ENABLED:-true}"
    depends_on: *after-infra

  assessment-service:
    <<: *spring-service
    build:
      context: .
      dockerfile: Dockerfile.spring-service
      args:
        MODULE_PATH: services/assessment-service
    environment:
      <<: *spring-env
      SERVER_PORT: 8083
      ASSESSMENT_DB_URL: jdbc:postgresql://postgres:5432/assessment_db
      ASSESSMENT_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: "${RABBITMQ_USERNAME}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      CONTENT_SERVICE_URL: http://content-service:8082
    depends_on:
      <<: *after-infra
      rabbitmq:
        condition: service_healthy

  learning-service:
    <<: *spring-service
    build:
      context: .
      dockerfile: Dockerfile.spring-service
      args:
        MODULE_PATH: services/learning-service
    environment:
      <<: *spring-env
      SERVER_PORT: 8086
      LEARNING_DB_URL: jdbc:postgresql://postgres:5432/learning_db
      LEARNING_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: "${RABBITMQ_USERNAME}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      CONTENT_SERVICE_URL: http://content-service:8082
      ACCESS_SERVICE_URL: http://access-service:8084
      LEARNING_LLM_BASE_URL: "${LEARNING_LLM_BASE_URL:-}"
      LEARNING_LLM_API_KEY: "${LEARNING_LLM_API_KEY:-}"
      LEARNING_LLM_MODEL: "${LEARNING_LLM_MODEL:-}"
      LEARNING_LLM_REASONING_EFFORT: "${LEARNING_LLM_REASONING_EFFORT:-}"
    depends_on:
      <<: *after-infra
      rabbitmq:
        condition: service_healthy

networks:
  mvp-network:
    driver: bridge

volumes:
  mvp-postgres-data:
  mvp-rabbitmq-data:
