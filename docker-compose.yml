  learning-support-db:
    image: postgres:15-alpine
    container_name: learning-support-db
    environment:
      POSTGRES_DB: learning_support_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - codebase-network
    volumes:
      - learning-support-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_support_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  community-db:
    image: postgres:15-alpine
    container_name: community-db
    environment:
      POSTGRES_DB: community_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - codebase-network
    volumes:
      - community-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d community_db"]
      interval: 5s
      timeout: 5s
      retries: 5