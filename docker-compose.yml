services:
  library-db:
    image: postgres:15-alpine
    container_name: library-db
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${LIBRARY_DB_PASSWORD:?Set LIBRARY_DB_PASSWORD}"
    ports:
      - "127.0.0.1:5437:5432"
    networks:
      - codebase-network
    volumes:
      - library-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  community-db:
    image: postgres:15-alpine
    container_name: community-db
    environment:
      POSTGRES_DB: community_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - codebase-network
    volumes:
      - community-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d community_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  game-db:
    image: postgres:15-alpine
    container_name: game-db
    environment:
      POSTGRES_DB: game_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${GAME_DB_PASSWORD:?Set GAME_DB_PASSWORD}"
    ports:
      - "127.0.0.1:5435:5432"
    networks:
      - codebase-network
    volumes:
      - game-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Integration event broker. Assessment publishes AssessmentCompleted.v2 to the "assessment.events" topic
  # exchange; Learning Service declares and consumes its own durable queue, retry queue and DLQ.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    networks:
      - codebase-network
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  learning-db:
    image: postgres:15-alpine
    container_name: learning-db
    environment:
      POSTGRES_DB: learning_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${LEARNING_DB_PASSWORD:?Set LEARNING_DB_PASSWORD}"
    ports:
      - "127.0.0.1:5436:5432"
    networks:
      - codebase-network
    volumes:
      - learning-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  game-service:
    build:
      context: .
      dockerfile: Dockerfile.spring-service
      args:
        MODULE_PATH: services/game-service
    container_name: game-service
    environment:
      SERVER_PORT: 8087
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      GAME_DB_URL: jdbc:postgresql://game-db:5432/game_db
      GAME_DB_USERNAME: postgres
      GAME_DB_PASSWORD: "${GAME_DB_PASSWORD:?Set GAME_DB_PASSWORD}"
      GATEWAY_INTERNAL_JWT_SECRET: "${GATEWAY_INTERNAL_JWT_SECRET:?Set GATEWAY_INTERNAL_JWT_SECRET}"
      CONTENT_SERVICE_URL: ${CONTENT_SERVICE_URL:-http://content-service:8082}
      LIBRARY_SERVICE_URL: ${LIBRARY_SERVICE_URL:-http://library-service:8081}
    ports:
      - "127.0.0.1:8087:8087"
    networks:
      - codebase-network
    depends_on:
      game-db:
        condition: service_healthy

networks:
  codebase-network:
    driver: bridge

volumes:
  library-db-data:
  community-db-data:
  game-db-data:
  rabbitmq-data:
  learning-db-data:
