services:
  learning-support-db:
    image: postgres:15-alpine
    container_name: learning-support-db
    environment:
      POSTGRES_DB: learning_support_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - codebase-network
    volumes:
      - learning-support-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_support_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  community-db:
    image: postgres:15-alpine
    container_name: community-db
    environment:
      POSTGRES_DB: community_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - codebase-network
    volumes:
      - community-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d community_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  game-db:
    image: postgres:15-alpine
    container_name: game-db
    environment:
      POSTGRES_DB: game_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${GAME_DB_PASSWORD:?Set GAME_DB_PASSWORD}"
    ports:
      - "127.0.0.1:5435:5432"
    networks:
      - codebase-network
    volumes:
      - game-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Integration event broker. Assessment publishes AssessmentCompleted.v2 to the "assessment.events" topic
  # exchange; AI Learning declares and consumes its own durable queue, retry queue and DLQ.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    networks:
      - codebase-network
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  # AI Learning (DeepTutor): its own database, migrated once by Flyway, then the API and the
  # AssessmentCompleted.v2 consumer from the same image. The Java services run on the host (IDE).
  ai-learning-db:
    image: postgres:15-alpine
    container_name: ai-learning-db
    environment:
      POSTGRES_DB: ai_learning_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${AI_LEARNING_DB_PASSWORD:?Set AI_LEARNING_DB_PASSWORD}"
    ports:
      - "127.0.0.1:5436:5432"
    networks:
      - codebase-network
    volumes:
      - ai-learning-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_learning_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-learning-migrate:
    # Same Flyway major as the Java services (Spring Boot 3.5 BOM).
    image: flyway/flyway:11-alpine
    container_name: ai-learning-migrate
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://ai-learning-db:5432/ai_learning_db
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: "${AI_LEARNING_DB_PASSWORD:?Set AI_LEARNING_DB_PASSWORD}"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./services/ai-learning-service/migrations:/flyway/sql:ro
    networks:
      - codebase-network
    depends_on:
      ai-learning-db:
        condition: service_healthy

  ai-learning-api:
    build: &ai-learning-build
      context: .
      dockerfile: services/ai-learning-service/Dockerfile
    container_name: ai-learning-api
    volumes:
      - ./services/ai-learning-service/deeptutor-data:/app/data
    environment:
      # Must equal the Gateway's value: the API validates the Gateway-signed internal JWT.
      AI_LEARNING_INTERNAL_JWT_SECRET: "${GATEWAY_INTERNAL_JWT_SECRET:?Set GATEWAY_INTERNAL_JWT_SECRET}"
      AI_LEARNING_DATABASE_URL: "postgresql://postgres:${AI_LEARNING_DB_PASSWORD:?Set AI_LEARNING_DB_PASSWORD}@ai-learning-db:5432/ai_learning_db"
      # The learner's internal JWT is forwarded straight to User and Content on the host, not through the Gateway.
      AI_LEARNING_USER_SERVICE_BASE_URL: ${AI_LEARNING_USER_SERVICE_BASE_URL:-http://host.docker.internal:8085}
      AI_LEARNING_CONTENT_SERVICE_BASE_URL: ${AI_LEARNING_CONTENT_SERVICE_BASE_URL:-http://host.docker.internal:8082}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - codebase-network
    depends_on:
      ai-learning-migrate:
        condition: service_completed_successfully

  ai-learning-consumer:
    build: *ai-learning-build
    container_name: ai-learning-consumer
    command: ["python", "-m", "app.messaging.assessment_consumer"]
    # Database and broker only: the consumer never needs the JWT secret.
    environment:
      AI_LEARNING_DATABASE_URL: "postgresql://postgres:${AI_LEARNING_DB_PASSWORD:?Set AI_LEARNING_DB_PASSWORD}@ai-learning-db:5432/ai_learning_db"
      AI_LEARNING_AMQP_URL: "amqp://${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672/%2F"
    networks:
      - codebase-network
    # The pika process exits when it loses the broker for good; compose brings it back.
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      ai-learning-migrate:
        condition: service_completed_successfully

  llm-stub:
    profiles: ["llm-stub"]
    image: python:3.11-slim
    command: ["python", "/stub/llm_stub.py"]
    environment:
      LLM_STUB_MODE: ${LLM_STUB_MODE:-reverse}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./services/ai-learning-service/tests/e2e/llm_stub.py:/stub/llm_stub.py:ro
    networks:
      - codebase-network

  game-service:
    build:
      context: .
      dockerfile: Dockerfile.spring-service
      args:
        MODULE_PATH: services/game-service
    container_name: game-service
    environment:
      SERVER_PORT: 8087
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      GAME_DB_URL: jdbc:postgresql://game-db:5432/game_db
      GAME_DB_USERNAME: postgres
      GAME_DB_PASSWORD: "${GAME_DB_PASSWORD:?Set GAME_DB_PASSWORD}"
      GATEWAY_INTERNAL_JWT_SECRET: "${GATEWAY_INTERNAL_JWT_SECRET:?Set GATEWAY_INTERNAL_JWT_SECRET}"
      CONTENT_SERVICE_URL: ${CONTENT_SERVICE_URL:-http://content-service:8082}
    ports:
      - "127.0.0.1:8087:8087"
    networks:
      - codebase-network
    depends_on:
      game-db:
        condition: service_healthy

networks:
  codebase-network:
    driver: bridge

volumes:
  learning-support-db-data:
  community-db-data:
  game-db-data:
  rabbitmq-data:
  ai-learning-db-data:
