# Log and trace stack, used as an override of docker-compose.yml. The default stack does not load this file, so
# its variables (GRAFANA_ADMIN_PASSWORD) are required only when the observability stack runs.
# Start with: docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability up -d loki tempo alloy grafana prometheus
services:
  # Turn on tracing for the gateway and business services. The default stack keeps tracing off.
  api-gateway: &traced
    environment:
      TRACING_ENABLED: "true"
      OTLP_TRACES_ENDPOINT: "http://alloy:4318/v1/traces"
  user-service: *traced
  content-service: *traced
  library-service: *traced
  access-service: *traced
  assessment-service: *traced
  learning-service: *traced
  game-service: *traced
  community-service: *traced
  notification-service: *traced

  loki:
    image: grafana/loki:3.7.6
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - codebase-network
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - codebase-network
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.21.3
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo
    networks:
      - codebase-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - codebase-network
    restart: unless-stopped

volumes:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
