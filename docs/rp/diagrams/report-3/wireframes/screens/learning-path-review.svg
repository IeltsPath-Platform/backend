"53.0" y="721.5" font-family="Segoe UI, Arial, sans-serif" font-size="17.92" font-weight="700" fill="#333333" text-anchor="start" textLength="105.1" lengthAdjust="spacingAndGlyphs">Paraphrase</text><rect x="1118.0" y="698.4" width="16.0" height="16.0" rx="3" fill="#bdbdbd"/><text x="53.0" y="762.5" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="368.8" lengthAdjust="spacingAndGlyphs">The question says the same idea with other words.</text><rect x="32.0" y="819.8" width="1136.0" height="714.2" rx="16.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><line x1="632.1" y1="820.8" x2="632.1" y2="2210.8" stroke="#c4c4c4"/><rect x="33.0" y="820.8" width="598.1" height="134.5" rx="16.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><rect x="55.0" y="847.0" width="16.0" height="16.0" rx="3" fill="#bdbdbd"/><text x="80.8" y="860.1" font-family="Segoe UI, Arial, sans-serif" font-size="16.8" font-weight="700" fill="#333333" text-anchor="start" textLength="112.9" lengthAdjust="spacingAndGlyphs">Review audio</text><rect x="576.1" y="841.8" width="34.0" height="26.5" rx="13.3" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><text x="584.9" y="859.7" font-family="Segoe UI, Arial, sans-serif" font-size="13.44" font-weight="700" fill="#333333" text-anchor="start">1</text><text x="593.6" y="859.7" font-family="Segoe UI, Arial, sans-serif" font-size="13.44" font-weight="700" fill="#333333" text-anchor="start">s</text><text x="61.0" y="993.3" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#333333" text-anchor="start">READING PASSAGE</text><text x="61.0" y="1046.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="527.5" lengthAdjust="spacingAndGlyphs">Cities have always been warmer than the countryside around them. Dark</text><text x="61.0" y="1072.8" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="533.9" lengthAdjust="spacingAndGlyphs">roofs and roads soak up sunlight during the day and give the heat back at</text><text x="61.0" y="1099.7" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="40.8" lengthAdjust="spacingAndGlyphs">night.</text><text x="61.0" y="1138.6" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="522.1" lengthAdjust="spacingAndGlyphs">Planting trees is one of the cheapest ways to cool a street. Shade keeps</text><text x="61.0" y="1165.5" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="516.7" lengthAdjust="spacingAndGlyphs">pavements from heating up, and water leaving the leaves lowers the air</text><text x="61.0" y="1192.3" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="93.1" lengthAdjust="spacingAndGlyphs">temperature.</text><text x="61.0" y="1231.2" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="514.3" lengthAdjust="spacingAndGlyphs">Some cities now paint roofs white. Early results suggest that the rooms</text><text x="61.0" y="1258.1" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="475.0" lengthAdjust="spacingAndGlyphs">underneath need far less power for cooling in the hottest months.</text><text x="660.1" y="858.7" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#333333" text-anchor="start">EXERCISES</text><text x="660.1" y="886.6" font-family="Segoe UI, Arial, sans-serif" font-size="17.28" font-weight="700" fill="#333333" text-anchor="start" textLength="175.0" lengthAdjust="spacingAndGlyphs">Set 3/3 · 00006002</text><text x="660.1" y="922.7" font-family="Segoe UI, Arial, sans-serif" font-size="14.08" font-weight="400" fill="#333333" text-anchor="start" textLength="191.0" lengthAdjust="spacingAndGlyphs">Answer the questions below.</text><text x="666.2" y="978.8" font-family="Segoe UI, Arial, sans-serif" font-size="15.68" font-weight="700" fill="#333333" text-anchor="start">1</text><text x="692.1" y="978.8" font-family="Segoe UI, Arial, sans-serif" font-size="15.68" font-weight="700" fill="#333333" text-anchor="start" textLength="397.2" lengthAdjust="spacingAndGlyphs">Planting trees can lower the temperature of a street.</text><rect x="703.3" y="1009.7" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="729.7" y="1022.2" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="39.6" lengthAdjust="spacingAndGlyphs">TRUE</text><rect x="703.3" y="1055.3" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="729.7" y="1067.7" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="45.1" lengthAdjust="spacingAndGlyphs">FALSE</text><rect x="703.3" y="1100.9" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="729.7" y="1113.3" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="82.3" lengthAdjust="spacingAndGlyphs">NOT GIVEN</text><line x1="660.1" y1="1148.5" x2="1139.0" y2="1148.5" stroke="#c4c4c4"/><text x="666.2" y="1184.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.68" font-weight="700" fill="#333333" text-anchor="start">2</text><text x="692.1" y="1184.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.68" font-weight="700" fill="#333333" text-anchor="start" textLength="393.8" lengthAdjust="spacingAndGlyphs">Painting roofs white costs more than planting trees.</text><rect x="703.3" y="1215.0" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="729.7" y="1227.4" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="39.6" lengthAdjust="spacingAndGlyphs">TRUE</text><rect x="703.3" y="1260.5" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="729.7" y="1273.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="45.1" lengthAdjust="spacingAndGlyphs">FALSE</text><rect x="703.3" y="1306.1" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="729.7" y="1318.6" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="82.3" lengthAdjust="spacingAndGlyphs">NOT GIVEN</text><rect x="632.1" y="1368.1" width="534.9" height="72.2" rx="0.0" fill="#ffffff" stroke="none" stroke-width="1.2"/><line x1="632.1" y1="1368.1" x2="1167.0" y2="1368.1" stroke="#c4c4c4"/><rect x="660.1" y="1382.7" width="136.0" height="44.0" rx="11.0" fill="#555555" stroke="none" stroke-width="1.2"/><text x="702.6" y="1409.8" font-family="Segoe UI, Arial, sans-serif" font-size="14.72" font-weight="700" fill="#ffffff" text-anchor="start" textLength="50.9" lengthAdjust="spacingAndGlyphs">Submit</text><text x="808.1" y="1409.6" font-family="Segoe UI, Arial, sans-serif" font-size="14.08" font-weight="400" fill="#333333" text-anchor="start" textLength="29.6" lengthAdjust="spacingAndGlyphs">Left:</text><text x="841.6" y="1409.6" font-family="Segoe UI, Arial, sans-serif" font-size="14.08" font-weight="400" fill="#333333" text-anchor="start">2</text><text x="854.2" y="1409.6" font-family="Segoe UI, Arial, sans-serif" font-size="14.08" font-weight="400" fill="#333333"