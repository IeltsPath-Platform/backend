.4" y="538.2" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start" textLength="73.3" lengthAdjust="spacingAndGlyphs">Mentions</text><text x="269.4" y="561.4" font-family="Segoe UI, Arial, sans-serif" font-size="14.08" font-weight="400" fill="#333333" text-anchor="start" textLength="295.3" lengthAdjust="spacingAndGlyphs">When someone mentions you in a comment.</text><rect x="844.2" y="530.8" width="46.4" height="26.4" rx="13.2" fill="#555555" stroke="none" stroke-width="1.2"/><rect x="866.9" y="533.5" width="21.0" height="21.0" rx="10.5" fill="#ffffff" stroke="none" stroke-width="1.2"/><rect x="190.0" y="595.6" width="720.0" height="80.8" rx="14.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><rect x="209.4" y="614.0" width="44.0" height="44.0" rx="12.0" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><rect x="222.4" y="627.0" width="18.0" height="18.0" rx="3" fill="#bdbdbd"/><text x="269.4" y="630.2" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start" textLength="77.6" lengthAdjust="spacingAndGlyphs">Reactions</text><text x="269.4" y="653.4" font-family="Segoe UI, Arial, sans-serif" font-size="14.08" font-weight="400" fill="#333333" text-anchor="start" textLength="237.0" lengthAdjust="spacingAndGlyphs">When someone reacts to your post.</text><rect x="844.2" y="622.8" width="46.4" height="26.4" rx="13.2" fill="#555555" stroke="none" stroke-width="1.2"/><rect x="866.9" y="625.5" width="21.0" height="21.0" rx="10.5" fill="#ffffff" stroke="none" stroke-width="1.2"/><rect x="190.0" y="687.5" width="720.0" height="80.8" rx="14.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><rect x="209.4" y="705.9" width="44.0" height="44.0" rx="12.0" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><rect x="222.4" y="718.9" width="18.0" height="18.0" rx="3" fill="#bdbdbd"/><text x="269.4" y="722.1" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start" textLength="111.4" lengthAdjust="spacingAndGlyphs">New followers</text><text x="269.4" y="745.4" font-family="Segoe UI, Arial, sans-serif" font-size="14.08" font-weight="400" fill="#333333" text-anchor="start" textLength="242.0" lengthAdjust="spacingAndGlyphs">When someone starts following you.</text><rect x="844.2" y="714.8" width="46.4" height="26.4" rx="13.2" fill="#555555" stroke="none" stroke-width="1.2"/><rect x="866.9" y="717.5" width="21.0" height="21.0" rx="10.5" fill="#ffffff" stroke="none" stroke-width="1.2"/><rect x="190.0" y="779.5" width="720.0" height="80.8" rx="14.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><rect x="209.4" y="797.9" width="44.0" height="44.0" rx="12.0" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><rect x="222.4" y="810.9" width="18.0" height="18.0" rx="3" fill="#bdbdbd"/><text x="269.4" y="814.1" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start" textLength="146.3" lengthAdjust="spacingAndGlyphs">Premium activated</text><text x="269.4" y="837.3" font-family="Segoe UI, Arial, sans-serif" font-size="14.08" font-weight="400" fill="#333333" text-anchor="start" textLength="283.8" lengthAdjust="spacingAndGlyphs">When Premium is granted to your account.</text><rect x="844.2" y="806.7" width="46.4" height="26.4" rx="13.2" fill="#555555" stroke="none" stroke-width="1.2"/><rect x="866.9" y="809.5" width="21.0" height="21.0" rx="10.5" fill="#ffffff" stroke="none" stroke-width="1.2"/><rect x="190.0" y="871.5" width="720.0" height="80.8" rx="14.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><rect x="209.4" y="889.9" width="44.0" height="44.0" rx="12.0" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><rect x="222.4" y="902.9" width="18.0" height="18.0" rx="3" fill="#bdbdbd"/><text x="269.4" y="906.1" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start" textLengt