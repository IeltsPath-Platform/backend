><text x="269.4" y="1113.3" font-family="Segoe UI, Arial, sans-serif" font-size="14.08" font-weight="400" fill="#333333" text-anchor="start" textLength="235.1" lengthAdjust="spacingAndGlyphs">Each morning when words are due.</text><rect x="844.2" y="1082.7" width="46.4" height="26.4" rx="13.2" fill="#555555" stroke="none" stroke-width="1.2"/><rect x="866.9" y="1085.4" width="21.0" height="21.0" rx="10.5" fill="#ffffff" stroke="none" stroke-width="1.2"/><rect x="190.0" y="1147.5" width="720.0" height="80.8" rx="14.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><rect x="209.4" y="1165.9" width="44.0" height="44.0" rx="12.0" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><rect x="222.4" y="1178.9" width="18.0" height="18.0" rx="3" fill="#bdbdbd"/><text x="269.4" y="1182.1" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start" textLength="66.9" lengthAdjust="spacingAndGlyphs">Overdue</text><text x="269.4" y="1205.3" font-family="Segoe UI, Arial, sans-serif" font-size="14.08" font-weight="400" fill="#333333" text-anchor="start" textLength="275.4" lengthAdjust="spacingAndGlyphs">When your requested grading is overdue.</text><rect x="844.2" y="1174.7" width="46.4" height="26.4" rx="13.2" fill="#555555" stroke="none" stroke-width="1.2"/><rect x="866.9" y="1177.4" width="21.0" height="21.0" rx="10.5" fill="#ffffff" stroke="none" stroke-width="1.2"/><rect x="190.0" y="1239.5" width="720.0" height="80.8" rx="14.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><rect x="209.4" y="1257.8" width="44.0" height="44.0" rx="12.0" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><rect x="222.4" y="1270.8" width="18.0" height="18.0" rx="3" fill="#bdbdbd"/><text x="269.4" y="1274.1" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start" textLength="96.0" lengthAdjust="spacingAndGlyphs">Grade ready</text><text x="269.4" y="1297.3" font-family="Segoe UI, Arial, san