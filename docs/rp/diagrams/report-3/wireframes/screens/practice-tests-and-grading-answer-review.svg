<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><rect width="1100" height="700" fill="#ffffff"/><rect x="0.0" y="0.0" width="1100.0" height="700.0" rx="0.0" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><rect x="14.4" y="8.8" width="32.0" height="32.0" rx="16.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><rect x="23.4" y="17.8" width="14.0" height="14.0" rx="3" fill="#bdbdbd"/><rect x="459.0" y="9.8" width="181.9" height="30.0" rx="15.0" fill="#555555" stroke="none" stroke-width="1.2"/><text x="476.6" y="29.4" font-family="Segoe UI, Arial, sans-serif" font-size="13.6" font-weight="700" fill="#ffffff" text-anchor="start">3</text><text x="485.4" y="29.4" font-family="Segoe UI, Arial, sans-serif" font-size="13.6" font-weight="700" fill="#ffffff" text-anchor="start">/</text><text x="490.7" y="29.4" font-family="Segoe UI, Arial, sans-serif" font-size="13.6" font-weight="700" fill="#ffffff" text-anchor="start">5</text><text x="503.2" y="29.4" font-family="Segoe UI, Arial, sans-serif" font-size="13.6" font-weight="700" fill="#ffffff" text-anchor="start" textLength="56.5" lengthAdjust="spacingAndGlyphs">correct ·</text><text x="563.3" y="29.4" font-family="Segoe UI, Arial, sans-serif" font-size="13.6" font-weight="700" fill="#ffffff" text-anchor="start" textLength="60.1" lengthAdjust="spacingAndGlyphs">00:16:00</text><rect x="14.4" y="49.6" width="528.4" height="583.4" rx="8.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><text x="201.0" y="84.5" font-family="Segoe UI, Arial, sans-serif" font-size="16.8" font-weight="700" fill="#333333" text-anchor="start" textLength="155.1" lengthAdjust="spacingAndGlyphs">Keeping cities cool</text><text x="39.4" y="125.6" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="443.8" lengthAdjust="spacingAndGlyphs">Cities have always been warmer than the countryside around</text><text x="39.4" y="151.8" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="461.6" lengthAdjust="spacingAndGlyphs">them. Dark roofs and roads soak up sunlight during the day and</text><text x="39.4" y="177.9" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="196.7" lengthAdjust="spacingAndGlyphs">give the heat back at night.</text><text x="39.4" y="220.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="474.3" lengthAdjust="spacingAndGlyphs">Planting trees is one of the cheapest ways to cool a street. Shade</text><text x="39.4" y="246.1" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="462.6" lengthAdjust="spacingAndGlyphs">keeps pavements from heating up, and water leaving the leaves</text><text x="39.4" y="272.2" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="195.0" lengthAdjust="spacingAndGlyphs">lowers the air temperature.</text><text x="39.4" y="314.3" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="464.4" lengthAdjust="spacingAndGlyphs">Some cities now paint roofs white. Early results suggest that the</text><text x="39.4" y="340.4" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="462.2" lengthAdjust="spacingAndGlyphs">rooms underneath need far less power for cooling in the hottest</text><text x="39.4" y="366.5" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="58.4" lengthAdjust="spacingAndGlyphs">months.</text><rect x="557.2" y="49.6" width="528.4" height="583.4" rx="8.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><text x="580.6" y="85.3" font-family="Segoe UI, Arial, sans-serif" font-size="17.6" font-weight="700" fill="#333333" text-anchor="start" textLength="127.1" lengthAdjust="spacingAndGlyphs">Questions 1 - 5</text><rect x="580.6" y="101.0" width="23.2" height="23.2" rx="11.6" fill="#555555" stroke="none" stroke-width="1.2"/><text x="589.6" y="116.0" font-family="Segoe UI, Arial, sans-serif" font-size="11.52" font-weight="700" fill="#ffffff" text-anchor="start">1</text><text x="613.4" y="117.1" font-family="Segoe UI, Arial, sans-serif" font-size="14.72" font-weight="400" fill="#333333" text-anchor="start" textLength="325.0" lengthAdjust="spacingAndGlyphs">City surfaces release stored heat after sunset.</text><rect x="1031.8" y="101.0" width="30.4" height="30.4" rx="15.2" fill="#f3f3f3" stroke="#555555" stroke-width="1.2"/><rect x="1040.0" y="109.2" width="14.0" height="14.0" rx="3" fill="#bdbdbd"/><rect x="613.4" y="136.2" width="448.8" height="31.0" rx="6.0" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><rect x="619.8" y="143.3" width="16.8" height="16.8" rx="8.4" fill="#ffffff" stroke="#555555" stroke-width="1.2"/><rect x="623.8" y="147.3" width="8.8" height="8.8" rx="4.4" fill="#555555" stroke="none" stroke-width="1.2"/><text x="646.2" y="156.8" font-family="Segoe UI, Arial, sans-serif" font-size="14.72" font-weight="700" fill="#333333" text-anchor="start" textLength="39.2" lengthAdjust="spacingAndGlyphs">TRUE</text><rect x="983.8" y="146.2" width="11.0" height="11.0" rx="3" fill="#bdbdbd"/><text x="999.0" y="155.2" font-family="Segoe UI, Arial, sans-serif" font-size="11.2" font-weight="700" fill="#333333" text-anchor="start" textLength="56.8" lengthAdjust="spacingAndGlyphs">You chose</text><rect x="619.8" y="174.3" width="16.8" height="16.8" rx="8.4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><text x="646.2" y="187.8" font-family="Segoe UI, Arial, sans-serif" font-size="14.72" font-weight="400" fill="#333333" text-anchor="start" textLength="44.1" lengthAdjust="spacingAndGlyphs">FALSE</text><rect x="619.8" y="205.3" width="16.8" height="16.8" rx="8.4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><text x="646.2" y="218.8" font-family="Segoe UI, Arial, sans-serif" font-size="14.72" font-weight="400" fill="#333333" text-anchor="start" textLength="80.6" lengthAdjust="spacingAndGlyphs">NOT GIVEN</text><rect x="613.4" y="237.2" width="448.8" height="69.9" rx="0.0" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><line x1="613.4" y1="237.2" x2="613.4" y2="307.1" stroke="#555555"/><text x="630.8" y="262.4" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#333333" text-anchor="start" textLength="67.0" lengthAdjust="spacingAndGlyphs">You chose:</text><text x="701.4" y="262.4" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#333333" text-anchor="start" textLength="34.3" lengthAdjust="spacingAndGlyphs">TRUE</text><text x="739.2" y="262.4" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#333333" text-anchor="start" textLength="104.2" lengthAdjust="spacingAndGlyphs">· Correct answer:</text><text x="847.1" y="262.4" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#333333" text-anchor="start" textLength="34.3" lengthAdjust="spacingAndGlyphs">TRUE</text><text x="630.8" y="289.5" font-family="Segoe UI, Arial, sans-serif" font-size="13.92" font-weight="400" fill="#333333" text-anchor="start" textLength="413.1" lengthAdjust="spacingAndGlyphs">The first paragraph says that roads give the heat back at night.</text><rect x="580.6" y="324.7" width="23.2" height="23.2" rx="11.6" fill="#555555" stroke="none" stroke-width="1.2"/><text x="588.5" y="339.7" font-family="Segoe UI, Arial, sans-serif" font-size="11.52" font-weight="700" fill="#ffffff" text-anchor="start">2</text><text x="613.4" y="340.9" font-family="Segoe UI, Arial, sans-serif" font-size="14.72" font-weight="400" fill="#333333" text-anchor="start" textLength="368.2" lengthAdjust="spacingAndGlyphs">Planting trees is more expensive than painting roofs.</text><rect x="1031.8" y="324.7" width="30.4" height="30.4" rx="15.2" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><rect x="1040.0" y="332.9" width="14.0" height="14.0" rx="3" fill="#bdbdbd"/><rect x="613.4" y="359.9" width="448.8" height="31.0" rx="6.0" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><rect x="619.8" y="367.0" width="16.8" height="16.8" rx="8.4" fill="#ffffff" stroke="#555555" stroke-width="1.2"/><rect x="623.8" y="371.0" width="8.8" height="8.8" rx="4.4" fill="#555555" stroke="none" stroke-width="1.2"/><text x="646.2" y="380.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.72" font-weight="700" fill="#333333" text-anchor="start" textLength="39.2" lengthAdjust="spacingAndGlyphs">TRUE</text><rect x="983.8" y="369.9" width="11.0" height="11.0" rx="3" fill="#bdbdbd"/><text x="999.0" y="378.9" font-family="Segoe UI, Arial, sans-serif" font-size="11.2" font-weight="700" fill="#333333" text-anchor="start" textLength="56.8" lengthAdjust="spacingAndGlyphs">You chose</text><rect x="613.4" y="390.9" width="448.8" height="31.0" rx="6.0" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><rect x="619.8" y="398.0" width="16.8" height="16.8" rx="8.4" fill="#ffffff" stroke="#555555" stroke-width="1.2"/><text x="646.2" y="411.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.72" font-weight="700" fill="#333333" text-anchor="start" textLength="45.2" lengthAdjust="spacingAndGlyphs">FALSE</text><text x="971.4" y="410.0" font-family="Segoe UI, Arial, sans-serif" font-size="11.2" font-weight="700" fill="#333333" text-anchor="start" textLength="84.5" lengthAdjust="spacingAndGlyphs">Correct answer</text><rect x="619.8" y="429.0" width="16.8" height="16.8" rx="8.4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><text x="646.2" y="442.6" font-family="Segoe UI, Arial, sans-serif" font-size="14.72" font-weight="400" fill="#333333" text-anchor="start" textLength="80.6" lengthAdjust="spacingAndGlyphs">NOT GIVEN</text><rect x="580.6" y="470.5" width="23.2" height="23.2" rx="11.6" fill="#555555" stroke="none" stroke-width="1.2"/><text x="588.4" y="485.5" font-family="Segoe UI, Arial, sans-serif" font-size="11.52" font-weight="700" fill="#ffffff" text-anchor="start">3</text><text x="613.4" y="486.7" font-family="Segoe UI, Arial, sans-serif" font-size="14.72" font-weight="400" fill="#333333" text-anchor="start" textLength="354.4" lengthAdjust="spacingAndGlyphs">White roofs reduce the energy needed for cooling.</text><rect x="1031.8" y="470.5" width="30.4" height="30.4" rx="15.2" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><rect x="1040.0" y="478.7" width="14.0" height="14.0" rx="3" fill="#bdbdbd"/><rect x="613.4" y="505.7" width="448.8" height="31.0" rx="6.0" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><rect x="619.8" y="512.8" width="16.8" height="16.8" rx="8.4" fill="#ffffff" stroke="#555555" stroke-width="1.2"/><rect x="623.8" y="516.8" width="8.8" height="8.8" rx="4.4" fill="#555555" stroke="none" stroke-width="1.2"/><text x="646.2" y="526.4" font-family="Segoe UI, Arial, sans-serif" font-size="14.72" font-weight="700" fill="#333333" text-anchor="start" textLength="39.2" lengthAdjust="spacingAndGlyphs">TRUE</text><rect x="983.8" y="515.7" width="11.0" height="11.0" rx="3" fill="#bdbdbd"/><text x="999.0" y="524.8" font-family="Segoe UI, Arial, sans-serif" font-size="11.2" font-weight="700" fill="#333333" text-anchor="start" textLength="56.8" lengthAdjust="spacingAndGlyphs">You chose</text><rect x="619.8" y="543.9" width="16.8" height="16.8" rx="8.4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><text x="646.2" y="557.4" font-family="Segoe UI, Arial, sans-serif" font-size="14.72" font-weight="400" fill="#333333" text-anchor="start" textLength="44.1" lengthAdjust="spacingAndGlyphs">FALSE</text><rect x="619.8" y="574.9" width="16.8" height="16.8" rx="8.4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><text x="646.2" y="588.4" font-family="Segoe UI, Arial, sans-serif" font-size="14.72" font-weight="400" fill="#333333" text-anchor="start" textLength="80.6" lengthAdjust="spacingAndGlyphs">NOT GIVEN</text><rect x="580.6" y="616.4" width="23.2" height="15.7" rx="11.6" fill="#555555" stroke="none" stroke-width="1.2"/><text x="588.2" y="631.4" font-family="Segoe UI, Arial, sans-serif" font-size="11.52" font-weight="700" fill="#ffffff" text-anchor="start">4</text><text x="613.4" y="632.5" font-family="Segoe UI, Arial, sans-serif" font-size="14.72" font-weight="400" fill="#333333" text-anchor="start" textLength="391.3" lengthAdjust="spacingAndGlyphs">Planners usually apply a single measure to a whole city.</text><rect x="1031.8" y="616.4" width="30.4" height="15.7" rx="15.2" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><rect x="1040.0" y="624.6" width="14.0" height="6.5" rx="3" fill="#bdbdbd"/><rect x="0.0" y="642.6" width="1100.0" height="57.4" rx="0.0" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><line x1="0.0" y1="642.6" x2="1100.0" y2="642.6" stroke="#c4c4c4"/><rect x="78.4" y="652.4" width="174.7" height="38.8" rx="4.0" fill="#ffffff" stroke="#555555" stroke-width="1.2"/><rect x="92.2" y="659.0" width="25.6" height="25.6" rx="12.8" fill="#555555" stroke="none" stroke-width="1.2"/><text x="102.4" y="675.2" font-family="Segoe UI, Arial, sans-serif" font-size="11.52" font-weight="700" fill="#ffffff" text-anchor="start">1</text><rect x="122.5" y="659.0" width="25.6" height="25.6" rx="12.8" fill="#555555" stroke="none" stroke-width="1.2"/><text x="131.7" y="675.2" font-family="Segoe UI, Arial, sans-serif" font-size="11.52" font-weight="700" fill="#ffffff" text-anchor="start">2</text><rect x="152.9" y="659.0" width="25.6" height="25.6" rx="12.8" fill="#555555" stroke="none" stroke-width="1.2"/><text x="161.9" y="675.2" font-family="Segoe UI, Arial, sans-serif" font-size="11.52" font-weight="700" fill="#ffffff" text-anchor="start">3</text><rect x="183.3" y="659.0" width="25.6" height="25.6" rx="12.8" fill="#555555" stroke="none" stroke-width="1.2"/><text x="192.1" y="675.2" font-family="Segoe UI, Arial, sans-serif" font-size="11.52" font-weight="700" fill="#ffffff" text-anchor="start">4</text><rect x="213.7" y="659.0" width="25.6" height="25.6" rx="12.8" fill="#b9b9b9" stroke="none" stroke-width="1.2"/><text x="222.8" y="675.2" font-family="Segoe UI, Arial, sans-serif" font-size="11.52" font-weight="700" fill="#8a8a8a" text-anchor="start">5</text><rect x="833.5" y="653.0" width="115.8" height="37.7" rx="18.8" fill="#b9b9b9" stroke="none" stroke-width="1.2"/><text x="855.3" y="675.6" font-family="Segoe UI, Arial, sans-serif" font-size="13.12" font-weight="700" fill="#8a8a8a" text-anchor="start" textLength="72.2" lengthAdjust="spacingAndGlyphs">View result</text><rect x="962.1" y="653.0" width="123.5" height="37.7" rx="18.8" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><text x="983.9" y="675.6" font-family="Segoe UI, Arial, sans-serif" font-size="13.12" font-weight="700" fill="#8a8a8a" text-anchor="start" textLength="79.9" lengthAdjust="spacingAndGlyphs">Another test</text><circle cx="1088.0" cy="12.0" r="11" fill="#c0392b"/><text x="1088.0" y="16.5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><circle cx="544.8" cy="51.6" r="11" fill="#c0392b"/><text x="544.8" y="56.1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><circle cx="1087.6" cy="51.6" r="11" fill="#c0392b"/><text x="1087.6" y="56.1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><rect x="0.5" y="0.5" width="1099" height="699" fill="none" stroke="#888888"/></svg>