" font-weight="700" fill="#333333" text-anchor="start" textLength="46.0" lengthAdjust="spacingAndGlyphs">Settings</text><rect x="110.0" y="76.0" width="976.0" height="64.0" rx="8.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><text x="129.0" y="113.0" font-family="Segoe UI, Arial, sans-serif" font-size="16.8" font-weight="700" fill="#333333" text-anchor="start" textLength="198.5" lengthAdjust="spacingAndGlyphs">Regrade a Writing essay</text><rect x="1009.3" y="89.0" width="57.7" height="38.0" rx="6.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><text x="1024.3" y="113.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start" textLength="27.7" lengthAdjust="spacingAndGlyphs">List</text><rect x="110.0" y="152.0" width="976.0" height="1124.3" rx="8.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><rect x="133.0" y="173.0" width="930.0" height="90.0" rx="8.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><text x="150.0" y="207.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="105.1" lengthAdjust="spacingAndGlyphs">Task question</text><text x="150.0" y="239.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="460.3" lengthAdjust="spacingAndGlyphs">Some people think cities need more public gardens. Discuss.</text><rect x="133.0" y="279.0" width="930.0" height="114.0" rx="8.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><text x="150.0" y="313.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="44.3" lengthAdjust="spacingAndGlyphs">Essay</text><text x="150.0" y="345.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="857.1" lengthAdjust="spacingAndGlyphs">Many cities now build small gardens on roofs. In my view this is useful because people can rest near their homes.</text><text x="150.0" y="369.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="294.4" lengthAdjust="spacingAndGlyphs">However, gardens cost money to keep.</text><rect x="133.0" y="409.0" width="930.0" height="58.0" rx="8.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><text x="166.9" y="443.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="126.2" lengthAdjust="spacingAndGlyphs">Reference rubric</text><text x="133.0" y="500.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="562.8" lengthAdjust="spacingAndGlyphs">This is blind grading. Follow the rubric; do not guess the Examiner's score.</text><text x="133.0" y="537.8" font-family="Segoe UI, Arial, sans-serif" font-size="13.6" font-weight="700" fill="#333333" text-anchor="start" textLength="197.7" lengthAdjust="spacingAndGlyphs">Task Response / Achievement</text><rect x="133.0" y="549.4" width="930.0" height="42.0" rx="6.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><text x="144.0" y="576.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start">6</text><text x="1047.0" y="574.4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#777777" text-anchor="start">▾</text><text x="133.0" y="632.2" font-family="Segoe UI, Arial, sans-serif" font-size="13.6" font-weight="700" fill="#333333" text-anchor="start" textLength="165.9" lengthAdjust="spacingAndGlyphs">Coherence and Cohesion</text><rect x="133.0" y="643.8" width="930.0" height="42.0" rx="6.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><text x="144.0" y="670.4" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start">6