="#333333" text-anchor="start">CHECK EARLIER KNOWLEDGE</text><text x="53.0" y="261.6" font-family="Segoe UI, Arial, sans-serif" font-size="31.2" font-weight="700" fill="#333333" text-anchor="start" textLength="184.3" lengthAdjust="spacingAndGlyphs">Short check</text><rect x="32.0" y="318.1" width="1136.0" height="713.9" rx="16.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><line x1="632.1" y1="319.1" x2="632.1" y2="1207.1" stroke="#c4c4c4"/><rect x="33.0" y="319.1" width="598.1" height="134.5" rx="16.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><rect x="55.0" y="345.3" width="16.0" height="16.0" rx="3" fill="#bdbdbd"/><text x="80.8" y="358.4" font-family="Segoe UI, Arial, sans-serif" font-size="16.8" font-weight="700" fill="#333333" text-anchor="start" textLength="106.2" lengthAdjust="spacingAndGlyphs">Check audio</text><rect x="576.1" y="340.1" width="34.0" height="26.5" rx="13.3" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><text x="584.9" y="358.0" font-family="Segoe UI, Arial, sans-serif" font-size="13.44" font-weight="700" fill="#333333" text-anchor="start">1</text><text x="593.6" y="358.0" font-family="Segoe UI, Arial, sans-serif" font-size="13.44" font-weight="700" fill="#333333" text-anchor="start">s</text><text x="61.0" y="491.6" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#333333" text-anchor="start">READING PASSAGE</text><text x="61.0" y="544.3" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="527.5" lengthAdjust="spacingAndGlyphs">Cities have always been warmer than the countryside around them. Dark</text><text x="61.0" y="571.1" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="533.9" lengthAdjust="spacingAndGlyphs">roofs and roads soak up sunlight during the day and give the heat back at</text><text x="61.0" y="598.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="40.8" lengthAdjust="spacingAndGlyphs">night.</text><text x="61.0" y="636.9" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="522.1" lengthAdjust="spacingAndGlyphs">Planting trees is one of the cheapest ways to cool a street. Shade keeps</text><text x="61.0" y="663.8" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="516.7" lengthAdjust="spacingAndGlyphs">pavements from heating up, and water leaving the leaves lowers the air</text><text x="61.0" y="690.6" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="93.1" lengthAdjust="spacingAndGlyphs">temperature.</text><text x="61.0" y="729.5" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="514.3" lengthAdjust="spacingAndGlyphs">Some cities now paint roofs white. Early results suggest that the rooms</text><text x="61.0" y="756.4" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="475.0" lengthAdjust="spacingAndGlyphs">underneath need far less power for cooling in the hottest months.</text><text x="660.1" y="357.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#333333" text-anchor="start">EXERCISES</text><text x="660.1" y="384.9" font-family="Segoe UI, Arial, sans-serif" font-size="17.28" font-weight="700" fill="#333333" text-anchor="start" textLength="216.8" lengthAdjust="spacingAndGlyphs">Check earlier knowledge</text><text x="660.1" y="421.0" font-family="Segoe UI, Arial, sans-serif" font-size="14.08" font-weight="400" fill="#333333" text-anchor="start" textLength="191.0" lengthAdjust="spacingAndGlyphs">Answer the questions below.</text><text x="666.2" y="477.1" font-family="Segoe UI, Arial, sans-serif" font-size="15.68" font-weight="700" fill="#333333" text-anchor="start">1</text><text x="692.1" y="477.1" font-family="Segoe UI, Arial, sans-serif" font-size="15.68" font-weight="700" fill="#333333" text-anchor="start" textLength="397.2" lengthAdjust="spacingAndGlyphs">Planting trees can lower the temperature of a street.</text><rect x="703.3" y="508.0" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="729.7" y="520.5" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="39.6" lengthAdjust="spacingAndGlyphs">TRUE</text><rect x="703.3" y="553.6" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="729.7" y="566.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="45.1" lengthAdjust="spacingAndGlyphs">FALSE</text><rect x="703.3" y="599.2" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="729.7" y="611.6" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="82.3" lengthAdjust="spacingAndGlyphs">NOT GIVEN</text><line x1="660.1" y1="646.8" x2="1139.0" y2="646.8" stroke="#c4c4c4"/><text x="666.2" y="682.3" font-family="Segoe UI, Arial, sans-serif" font-size="15.68" font-weight="700" fill="#333333" text-anchor="start">2</text><text x="692.1" y="682.3" font-family="Segoe UI, Arial, sans-serif" font-size="15.68" font-weight="700" fill="#333333" text-anchor="start" textLength="393.8" lengthAdjust="spacingAndGlyphs">Painting roofs white costs more than planting trees.</text><rect x="703.3" y="713.3" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="729.7" y="725.7" font-family="Segoe UI, Arial, sans-serif" fon