 x2="632.1" y2="1439.1" stroke="#c4c4c4"/><text x="61.0" y="418.1" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#333333" text-anchor="start">READING PASSAGE</text><text x="61.0" y="470.8" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="527.5" lengthAdjust="spacingAndGlyphs">Cities have always been warmer than the countryside around them. Dark</text><text x="61.0" y="497.6" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="533.9" lengthAdjust="spacingAndGlyphs">roofs and roads soak up sunlight during the day and give the heat back at</text><text x="61.0" y="524.5" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="40.8" lengthAdjust="spacingAndGlyphs">night.</text><text x="61.0" y="563.4" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="522.1" lengthAdjust="spacingAndGlyphs">Planting trees is one of the cheapest ways to cool a street. Shade keeps</text><text x="61.0" y="590.3" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="516.7" lengthAdjust="spacingAndGlyphs">pavements from heating up, and water leaving the leaves lowers the air</text><text x="61.0" y="617.1" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="93.1" lengthAdjust="spacingAndGlyphs">temperature.</text><text x="61.0" y="656.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="514.3" lengthAdjust="spacingAndGlyphs">Some cities now paint roofs white. Early results suggest that the rooms</text><text x="61.0" y="682.9" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="475.0" lengthAdjust="spacingAndGlyphs">underneath need far less power for cooling in the hottest months.</text><text x="660.1" y="418.1" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#333333" text-anchor="start">PART</text><text x="702.3" y="418.1" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#333333" text-anchor="start">2</text><text x="711.4" y="418.1" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#333333" text-anchor="start">/</text><text x="717.6" y="418.1" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#333333" text-anchor="start">3</text><text x="660.1" y="448.4" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#333333" text-anchor="start" textLength="115.8" lengthAdjust="spacingAndGlyphs">Urban trees</text><text x="660.1" y="484.7" font-family="Segoe UI, Arial, sans-serif" font-size="14.08" font-weight="400" fill="#333333" text-anchor="start" textLength="183.7" lengthAdjust="spacingAndGlyphs">Choose the correct answer.</text><text x="666.2" y="540.8" font-family="Segoe UI, Arial, sans-serif" font-size="15.68" font-weight="700" fill="#333333" text-anchor="start">1</text><text x="692.1" y="540.8" font-family="Segoe UI, Arial, sans-serif" font-size="15.68" font-weight="700" fill="#333333" text-anchor="start" textLength="397.2" lengthAdjust="spacingAndGlyphs">Planting trees can lower the temperature of a street.</text><rect x="692.1" y="557.7" width="446.9" height="44.0" rx="10.0" fill="#f3f3f3" stroke="#cccccc" stroke-width="1.2"/><rect x="703.3" y="571.7" width="16.0" height="16.0" rx="8.0" fill="#555555" stroke="#555555" stroke-width="1.2"/><rect x="707.3" y="575.7" width="8.0" height="8.0" rx="4.0" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><text x="729.7" y="584.2" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="39.6" lengthAdjust="spacingAndGlyphs">TRUE</text><rect x="703.3" y="617.3" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="729.7" y="629.8" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="45.1" lengthAdjust="spacingAndGlyphs">FALSE</text><rect x="703.3" y="662.9" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="729.7" y="675.4" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="82.3" lengthAdjust="spacingAndGlyphs">NOT GIVEN</text><rect x="665.1" y="720.7" width="12.0" height="12.0" rx="3" fill="#bdbdbd"/><text x="683.7" y="730.5" font-family="Segoe UI, Arial, sans-serif" font-size="13.12" font-weight="700" fill="#333333" text-anchor="start" textLength="39.3" lengthAdjust="spacingAndGlyphs">Saved</text><line x1="660.1" y1="739.7" x2="1139.0" y2="739.7" stroke="#c4c4c4"/><text x="666.2" y="775.3" font-family="Segoe UI, Arial, sans-serif" font-size="15.68" font-weight="700" fill="#333333" text-anchor="start">2</text><text x="692.1" y="775.3" font-family="Segoe UI, Arial, sans-serif" font-size="15.68" font-weight="700" fill="#333333" text-anchor="start" textLength="393.8" lengthAdjust="spacingAndGlyphs">Painting roofs white costs more than planting trees.</text><rect x="703.3" y="806.2" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="729.7" y="818.7" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="39.6" lengthAdjust="spacingAndGlyphs">TRUE</text><rect x="703.3" y="851.8" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="729.7" y="864.3" font-family="Segoe UI, Ari