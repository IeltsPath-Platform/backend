th="506.0" height="400.2" rx="18.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><line x1="585.4" y1="429.4" x2="1044.6" y2="429.4" stroke="#c4c4c4"/><rect x="589.4" y="384.8" width="24.0" height="24.0" rx="3" fill="#bdbdbd"/><line x1="585.4" y1="493.6" x2="1044.6" y2="493.6" stroke="#c4c4c4"/><rect x="589.4" y="449.0" width="24.0" height="24.0" rx="3" fill="#bdbdbd"/><line x1="585.4" y1="557.8" x2="1044.6" y2="557.8" stroke="#c4c4c4"/><rect x="589.4" y="513.2" width="24.0" height="24.0" rx="3" fill="#bdbdbd"/><line x1="585.4" y1="621.9" x2="1044.6" y2="621.9" stroke="#c4c4c4"/><rect x="589.4" y="577.3" width="24.0" height="24.0" rx="3" fill="#bdbdbd"/><rect x="0.0" y="0.0" width="1100.0" height="700.0" rx="0.0" fill="#ffffff" stroke="none" stroke-width="1.2"/><rect x="0.0" y="0.0" width="1100.0" height="64.4" rx="0.0" fill="#555555" stroke="none" stroke-width="1.2"/><rect x="32.0" y="9.6" width="124.0" height="45.2" rx="6" fill="#eeeeee" stroke="#aaaaaa"/><path d="M32.0 9.6L156.0 54.8M156.0 9.6L32.0 54.8" stroke="#bbbbbb" fill="none"/><text x="172.0" y="26.9" font-family="Segoe UI, Arial, sans-serif" font-size="16.8" font-weight="700" fill="#ffffff" text-anchor="start" textLength="132.0" lengthAdjust="spacingAndGlyphs">Placement test ·</text><text x="307.5" y="26.9" font-family="Segoe UI, Arial, sans-serif" font-size="16.8" font-weight="700" fill="#ffffff" text-anchor="start" textLength="67.7" lengthAdjust="spacingAndGlyphs">Reading</text><text x="172.0" y="47.2" font-family="Segoe UI, Arial, sans-serif" font-size="13.6" font-weight="400" fill="#ffffff" text-anchor="start" textLength="50.9" lengthAdjust="spacingAndGlyphs">Elapsed</text><text x="226.5" y="47.2" font-family="Segoe UI, Arial, sans-serif" font-size="13.6" font-weight="400" fill="#ffffff" text-anchor="start" textLength="38.9" lengthAdjust="spacingAndGlyphs">00:04</text><text x="269.1" y="47.2" font-family="Segoe UI, Arial, sans-serif" font-size="13.6" font-weight="400" fill="#ffffff" text-anchor="start" textLength="84.9" lengthAdjust="spacingAndGlyphs">· no time limit</text><rect x="1028.0" y="12.2" width="40.0" height="40.0" rx="20.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><rect x="1040.0" y="24.2" width="16.0" height="16.0" rx="3" fill="#bdbdbd"/><rect x="32.0" y="76.4" width="1036.0" height="79.6" rx="10.0" fill="#f3f3f3" stroke="#b5b5b5" stroke-width="1.2"/><text x="49.0" y="108.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start" textLength="77.0" lengthAdjust="spacingAndGlyphs">Passage 1</text><text x="49.0" y="135.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="168.4" lengthAdjust="spacingAndGlyphs">Answer the questions.</text><text x="32.0" y="195.5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#333333" text-anchor="start" textLength="186.8" lengthAdjust="spacingAndGlyphs">Keeping cities cool</text><text x="32.0" y="221.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="462.2" lengthAdjust="spacingAndGlyphs">Cities have always been warmer than the countryside around</text><text x="32.0" y="249.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="480.9" lengthAdjust="spacingAndGlyphs">them. Dark roofs and roads soak up sunlight during the day and</text><text x="32.0" y="277.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="204.9" lengthAdjust="spacingAndGlyphs">give the heat back at night.</text><text x="32.0" y="323.2" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="494.0" lengthAdjust="spacingAndGlyphs">Planting trees is one of the cheapest ways to cool a street. Shade</text><text x="32.0" y="351.2" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="481.9" lengthAdjust="spacingAndGlyphs">keeps pavements from heating up, and water leaving the leaves</text><text x="32.0" y="379.2" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="203.1" lengthAdjust="spacingAndGlyphs">lowers the air temperature.</text><text x="32.0" y="424.8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="483.8" lengthAdjust="spacingAndGlyphs">Some cities now paint roofs white. Early results suggest that the</text><text x="32.0" y="452.8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="481.4" lengthAdjust="spacingAndGlyphs">rooms underneath need far less power for cooling in the hottest</text><text x="32.0" y="480.8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="60.8" lengthAdjust="spacingAndGlyphs">months.</text><rect x="554.0" y="387.6" width="28.0" height="28.0" rx="6.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><rect x="561.0" y="394.6" width="14.0" height="14.0" rx="3" fill="#bdbdbd"/><text x="594.0" y="193.0" font-family="Segoe UI, Arial, sans-serif" font-size="17.28" font-weight="700" fill="#333333" text-anchor="start" textLength="122.8" lengthAdjust="spacingAndGlyphs">Questions 1–2</text><text x="594.0" y="222.5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="458.8" lengthAdjust="spacingAndGlyphs">Do the following statements agree with the information given</text><text x="594.0" y="246.5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="118.5" lengthAdjust="spacingAndGlyphs">in the passage?</text><text x="594.0" y="276.1" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start" textLength="42.8" lengthAdjust="spacingAndGlyphs">TRUE</text><text x="694.0" y="276.1" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="329.2" lengthAdjust="spacingAndGlyphs">if the statement agrees with the information</text><text x="594.0" y="301.7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start" textLength="49.6" lengthAdjust="spacingAndGlyphs">FALSE</text><text x="694.0" y="301.7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="326.1" lengthAdjust="spacingAndGlyphs">if the statement contradicts the information</text><text x="594.0" y="327.3" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start" textLength="89.4" lengthAdjust="spacingAndGlyphs">NOT GIVEN</text><text x="695.4" y="327.3" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="239.1" lengthAdjust="spacingAndGlyphs">if there is no information on this</text><rect x="594.0" y="359.3" width="28.0" height="28.0" rx="4.0" fill="none" stroke="#555555" stroke-width="1.2"/><text x="604.5" y="378.1" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start">1</text><text x="634.0" y="376.9" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="392.9" lengthAdjust="spacingAndGlyphs">Planting trees can lower the temperature of a street.</text><rect x="1047.0" y="366.3" width="14.0" height="14.0" rx="3" fill="#bdbdbd"/><rect x="603.6" y="409.5" width="18.0" height="18.0" rx="9.0" fill="none" stroke="#555555" stroke-width="1.2"/><text x="633.6" y="424.1" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="42.2" lengthAdjust="spacingAndGlyphs">TRUE</text><rect x="603.6" y="455.9" width="18.0" height="18.0" rx="9.0" fill="none" stroke="#555555" stroke-width="1.2"/><text x="633.6" y="470.5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="48.0" lengthAdjust="spacingAndGlyphs">FALSE</text><rect x="603.6" y="502.2" width="18.0" height="18.0" rx="9.0" fill="none" stroke="#555555" stroke-width="1.2"/><text x="633.6" y="516.8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="87.6" lengthAdjust="spacingAndGlyphs">NOT GIVEN</text><text x="602.9" y="570.8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start">2</text><text x="634.0" y="569.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="387.9" lengthAdjust="spacingAndGlyphs">Painting roofs white costs more than planting trees.</text><rect x="1047.0" y="559.0" width="14.0" height="14.0" rx="3" fill="#bdbdbd"/><rect x="603.6" y="602.2" width="18.0" height="18.0" rx="9.0" fill="none" stroke="#555555" stroke-width="1.2"/><text x="633.6" y="616.8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#333333" text-anchor="start" textLength="42.2" lengthAdjust="spacingAndGlyphs">TRUE</text><rect x="964.0" y="571.2" width="52.0" height="52.0" rx="4.0" fill="#555555" stroke="none" stroke-width="1.2"/><rect x="979.0" y="586.2" width="22.0" height="22.0" rx="3" fill="#bdbdbd"/><rect x="1024.0" y="571.2" width="52.0" height="52.0" rx="4.0" fill="#555555" stroke="none" stroke-width="1.2"/><rect x="1039.0" y="586.2" width="22.0" height="22.0" rx="3" fill="#bdbdbd"/><rect x="0.0" y="647.2" width="1100.0" height="52.8" rx="0.0" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><line x1="0.0" y1="647.2" x2="1100.0" y2="647.2" stroke="#c4c4c4"/><text x="32.0" y="678.5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="start" textLength="77.7" lengthAdjust="spacingAndGlyphs">Passage 1</text><rect x="125.7" y="662.4" width="28.0" height="28.0" rx="4.0" fill="none" stroke="#555555" stroke-width="1.2"/><text x="136.4" y="680.8" font-family="Segoe UI, Arial, sans-serif" font-size="15.2" font-weight="700" fill="#333333" text-anchor="start">1</text><text x="166.3" y="680.8" font-family="Segoe UI, Arial, sans-serif" font-size="15.2" font-weight="400" fill="#333333" text-anchor="start">2</text><rect x="1036.0" y="648.2" width="64.0" height="51.8" rx="0.0" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><line x1="1036.0" y1="648.2" x2="1036.0" y2="700.0" stroke="#c4c4c4"/><rect x="1058.5" y="664.1" width="20.0" height="20.0" rx="3" fill="#bdbdbd"/><circle cx="1022.0" cy="650.2" r="11" fill="#c0392b"/><text x="1022.0" y="654.7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><circle cx="1088.0" cy="158.0" r="11" fill="#c0392b"/><text x="1088.0" y="162.5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><circle cx="1088.0" cy="650.2" r="11" fill="#c0392b"/><text x="1088.0" y="654.7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><rect x="0.5" y="0.5" width="1099" height="699" fill="none" stroke="#888888"/></svg>