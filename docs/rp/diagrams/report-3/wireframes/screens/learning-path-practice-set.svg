font-size="12.8" font-weight="700" fill="#333333" text-anchor="start">READING FOUNDATIONS</text><text x="113.0" y="255.2" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#333333" text-anchor="start" textLength="381.3" lengthAdjust="spacingAndGlyphs">Recognising paraphrase</text><rect x="92.0" y="303.8" width="1176.0" height="98.4" rx="16.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><text x="113.0" y="338.8" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#333333" text-anchor="start">EXTRA PRACTICE ·</text><text x="252.6" y="338.8" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#333333" text-anchor="start" textLength="42.5" lengthAdjust="spacingAndGlyphs">PS-01</text><text x="113.0" y="374.7" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#333333" text-anchor="start" textLength="308.3" lengthAdjust="spacingAndGlyphs">Paraphrase practice: city trees</text><rect x="92.0" y="418.2" width="1176.0" height="713.8" rx="16.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><line x1="713.2" y1="419.2" x2="713.2" y2="1407.2" stroke="#c4c4c4"/><rect x="93.0" y="419.2" width="619.2" height="170.6" rx="16.0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.2"/><rect x="115.0" y="445.4" width="16.0" height="16.0" rx="3" fill="#bdbdbd"/><text x="140.8" y="458.5" font-family="Segoe UI, Arial, sans-serif" font-size="16.8" font-weight="700" fill="#333333" text-anchor="start" textLength="125.2" lengthAdjust="spacingAndGlyphs">Practice audio</text><rect x="657.2" y="440.2" width="34.0" height="26.5" rx="13.3" fill="#f3f3f3" stroke="none" stroke-width="1.2"/><text x="666.0" y="458.0" font-family="Segoe UI, Arial, sans-serif" font-size="13.44" font-weight="700" fill="#333333" text-anchor="start">1</text><text x="674.7" y="458.0" font-family="Segoe UI, Arial, sans-serif" font-size="13.44" font-weight="700" fill="#333333" text-anchor="start">s</text><text x="129.9" y="561.5" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="700" fill="#333333" text-anchor="start" textLength="75.7" lengthAdjust="spacingAndGlyphs">Transcript</text><text x="121.0" y="627.7" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#333333" text-anchor="start">READING PASSAGE</text><text x="121.0" y="680.4" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="527.5" lengthAdjust="spacingAndGlyphs">Cities have always been warmer than the countryside around them. Dark</text><text x="121.0" y="707.3" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="533.9" lengthAdjust="spacingAndGlyphs">roofs and roads soak up sunlight during the day and give the heat back at</text><text x="121.0" y="734.2" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="40.8" lengthAdjust="spacingAndGlyphs">night.</text><text x="121.0" y="773.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="522.1" lengthAdjust="spacingAndGlyphs">Planting trees is one of the cheapest ways to cool a street. Shade keeps</text><text x="121.0" y="799.9" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="516.7" lengthAdjust="spacingAndGlyphs">pavements from heating up, and water leaving the leaves lowers the air</text><text x="121.0" y="826.8" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="93.1" lengthAdjust="spacingAndGlyphs">temperature.</text><text x="121.0" y="865.7" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="514.3" lengthAdjust="spacingAndGlyphs">Some cities now paint roofs white. Early results suggest that the rooms</text><text x="121.0" y="892.5" font-family="Segoe UI, Arial, sans-serif" font-size="15.36" font-weight="400" fill="#333333" text-anchor="start" textLength="475.0" lengthAdjust="spacingAndGlyphs">underneath need far less power for cooling in the hottest months.</text><text x="741.2" y="457.1" font-family="Segoe UI, Arial, sans-serif" font-size="12.8" font-weight="700" fill="#333333" text-anchor="start">EXERCISES</text><text x="741.2" y="485.0" font-family="Segoe UI, Arial, sans-serif" font-size="17.28" font-weight="700" fill="#333333" text-anchor="start" textLength="273.1" lengthAdjust="spacingAndGlyphs">Paraphrase practice: city trees</text><text x="741.2" y="521.1" font-family="Segoe UI, Arial, sans-serif" font-size="14.08" font-weight="400" fill="#333333" text-anchor="start" textLength="418.8" lengthAdjust="spacingAndGlyphs">Answer every question. Passing counts for the lesson practice.</text><text x="747.3" y="577.1" font-family="Segoe UI, Arial, sans-serif" font-size="15.68" font-weight="700" fill="#333333" text-anchor="start">1</text><text x="773.2" y="577.1" font-family="Segoe UI, Arial, sans-serif" font-size="15.68" font-weight="700" fill="#333333" text-anchor="start" textLength="397.2" lengthAdjust="spacingAndGlyphs">Planting trees can lower the temperature of a street.</text><rect x="784.4" y="608.1" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="810.8" y="620.5" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="39.6" lengthAdjust="spacingAndGlyphs">TRUE</text><rect x="784.4" y="653.7" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="810.8" y="666.1" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="45.1" lengthAdjust="spacingAndGlyphs">FALSE</text><rect x="784.4" y="699.3" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="810.8" y="711.7" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="82.3" lengthAdjust="spacingAndGlyphs">NOT GIVEN</text><line x1="741.2" y1="746.8" x2="1239.0" y2="746.8" stroke="#c4c4c4"/><text x="747.3" y="782.4" font-family="Segoe UI, Arial, sans-serif" font-size="15.68" font-weight="700" fill="#333333" text-anchor="start">2</text><text x="773.2" y="782.4" font-family="Segoe UI, Arial, sans-serif" font-size="15.68" font-weight="700" fill="#333333" text-anchor="start" textLength="393.8" lengthAdjust="spacingAndGlyphs">Painting roofs white costs more than planting trees.</text><rect x="784.4" y="813.3" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="810.8" y="825.8" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="39.6" lengthAdjust="spacingAndGlyphs">TRUE</text><rect x="784.4" y="858.9" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="810.8" y="871.4" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="45.1" lengthAdjust="spacingAndGlyphs">FALSE</text><rect x="784.4" y="904.5" width="16.0" height="16.0" rx="8.0" fill="none" stroke="#b5b5b5" stroke-width="1.2"/><text x="810.8" y="917.0" font-family="Segoe UI, Arial, sans-serif" font-size="15.04" font-weight="400" fill="#333333" text-anchor="start" textLength="82.3" lengthAdjust="spacingAndGlyphs">NOT GIVEN</text><rect x="713.2" y="966.5" width="553.8" height="72.2" rx="0.0" fill="#ffffff" stroke="none" stroke-width="1.2"/><line x1="713.2" y1="966.5" x2="1267.0" y2="966.5" stroke="#c4c4c4"/><rect x="741.2" y="981.1" width="136.0" height="44.0" rx="11.0" fill="#555555" stroke="none" stroke-width="1.2"/><text x="783.8" y="1008.2" font-family="Segoe UI, Arial, sans-serif" font-size="14.72" font-weight="700" fill="#ffffff" text-anchor="start" textLength="50.9" lengthAdjust="spacingAndGlyphs">Submit</text><text x="889.2" y="1008.0" font-family="Segoe UI, Arial, sans-serif" font-size="14.08" font-weight="400" fill="#333333" text-anchor="start" textLength="29.6" lengthAdjust="spacingAndGlyphs">Left:</text><text x="922.8" y="1008.0" font-family="Segoe UI, Arial, sans-serif" font-size="14.08" font-weight="400" fill="#333333" text-anchor="start">2</text><text x="935.3" y="1008.0" font-family="Segoe UI, Arial, sans-serif" font-size="14.08" font-weight="400" fill="#333333" text-anchor="start" textLength="150.5" lengthAdjust="spacingAndGlyphs">questions unanswered</text><circle cx="793.5" cy="124.6" r="11" fill="#c0392b"/><text x="793.5" y="129.1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><circle cx="1270.0" cy="305.8" r="11" fill="#c0392b"/><text x="1270.0" y="310.3" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><circle cx="1270.0" cy="420.2" r="11" fill="#c0392b"/><text x="1270.0" y="424.7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><circle cx="879.2" cy="983.1" r="11" fill="#c0392b"/><text x="879.2" y="987.6" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><rect x="0.5" y="0.5" width="1359" height="1131" fill="none" stroke="#888888"/></svg>