0" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="720,828 720,880 14,880 14,360 345,360" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="450" cy="70" r="13" fill="#1f2937" stroke="#1f2937" stroke-width="1.6"/><rect x="305" y="119" width="290" height="62" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="450" y="145.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Ask the learner to review</text><text x="450" y="164.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">a weak skill</text><polygon points="450,208 555,250 450,292 345,250" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="245.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Could the review</text><text x="450" y="264.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">be loaded?</text><rect x="595" y="219" width="250" height="62" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="720" y="245.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Show an error; the learner</text><text x="720" y="264.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">can try again later</text><polygon points="450,318 555,360 450,402 345,360" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="355.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">New questions</text><text x="450" y="374.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">available?</text><rect x="595" y="336" width="250" height="48" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="720" y="365" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Skip the review</text><rect x="33" y="439" width="250" height="62" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.6"/><text x="158" y="465.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Answer the review</text><text x="158" y="484.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">questions</text><polygon points="450,528 555,570 450,612 345,570" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="565.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Scored 70%</text><text x="450" y="584.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">or more?</text><rect x="595" y="546" width="250" height="48" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="720" y="575" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Mark the review as done</text><polygon points="450,638 555,680 450,722 345,680" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="675.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Failed four</text><text x="450" y="694.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">times?</text><rect x="595" y="649" width="250" height="62" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="720" y="675.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Let the learner continue;</text><text x="720" y="694.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">the review becomes optional</text><polygon points="450,748 555,790 450,832 345,790" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="785.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Is this the second</text><text x="450" y="804.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">failed try?</text><rect x="595" y="752" width="250" height="76" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="720" y="776" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Check the earlier knowledge</text><text x="720" y="795" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">it builds on; it can be</text><text x="720" y="814" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">stopped after one answer</text><rect x="33" y="759" width="250" height="62" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.6"/><text x="158" y="785.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Read the theory again</text><text x="158" y="804.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">and answer a quick check</text></svg></div></body></html>
