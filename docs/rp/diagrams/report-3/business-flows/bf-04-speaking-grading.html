th="1.6" marker-end="url(#arrow)"/><text x="321.0" y="690" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">No</text><polyline points="450,742 450,779" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="468" y="762.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Yes</text><polyline points="305,810 283,810" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="158,834 158,877" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="158" cy="70" r="13" fill="#1f2937" stroke="#1f2937" stroke-width="1.6"/><rect x="33" y="119" width="250" height="62" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.6"/><text x="158" y="145.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Agree to the terms and</text><text x="158" y="164.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">record the answers</text><polygon points="450,108 555,150 450,192 345,150" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="145.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Allowed to</text><text x="450" y="164.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">submit?</text><rect x="590" y="104" width="200" height="92" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="690" y="136" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Tell the learner why:</text><text x="690" y="155" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">grading is off or the</text><text x="690" y="174" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">daily limit is reached</text><polygon points="450,218 555,260 450,302 345,260" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="255.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Did the recordings</text><text x="450" y="274.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">arrive?</text><rect x="590" y="229" width="200" height="62" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="690" y="255.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Ask the learner to</text><text x="690" y="274.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">send them again</text><rect x="305" y="339" width="290" height="62" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="450" y="365.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Accept the recordings and</text><text x="450" y="384.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">grade them in the background</text><rect x="810" y="339" width="190" height="62" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="905" y="365.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Listen to the answers</text><text x="905" y="384.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">and grade Speaking</text><polygon points="905,438 990,480 905,522 820,480" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="905" y="475.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Speech</text><text x="905" y="494.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">heard?</text><rect x="590" y="442" width="200" height="76" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="690" y="475.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Tell the learner that</text><text x="690" y="494.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">no speech was heard</text><polygon points="905,548 990,590 905,632 820,590" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="905" y="585.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Graded</text><text x="905" y="604.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">properly?</text><rect x="590" y="552" width="200" height="76" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="690" y="585.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Take no points; pass</text><text x="690" y="604.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">it to an examiner</text><polygon points="450,658 555,700 450,742 345,700" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="695.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Enough</text><text x="450" y="714.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">points?</text><rect x="33" y="662" width="250" height="76" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="158" y="695.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Keep the grade until the</text><text x="158" y="714.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">learner has enough points</text><rect x="305" y="779" width="290" height="62" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="450" y="805.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Take the points; show the</text><text x="450" y="824.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">band and the feedback</text><rect x="33" y="786" width="250" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.6"/><text x="158" y="815" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Read the feedback</text><circle cx="158" cy="890" r="13" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><circle cx="158" cy="890" r="7" fill="#1f2937" stroke="#1f2937" stroke-width="1.6"/></svg></div></body></html>
