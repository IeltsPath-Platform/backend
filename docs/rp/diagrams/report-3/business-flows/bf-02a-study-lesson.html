<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BF-02a Study a lesson</title><style>body{margin:0;background:#ffffff}.wrap{overflow-x:auto}svg{min-width:858px;display:block}</style></head><body><div class="wrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 858 820" width="858" height="820" role="img" aria-labelledby="bf-02a-study-lesson-title bf-02a-study-lesson-desc" font-family="Segoe UI, Arial, sans-serif"><title id="bf-02a-study-lesson-title">BF-02a Study a lesson</title><desc id="bf-02a-study-lesson-desc">How a learner studies a lesson and what stops them.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f4e79"/></marker></defs><rect width="858" height="820" fill="#ffffff"/><rect x="8" y="8" width="300" height="804" fill="none" stroke="#9ca3af" stroke-width="1.2"/><rect x="8" y="8" width="300" height="44" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/><text x="158.0" y="37" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Learner</text><rect x="308" y="8" width="542" height="804" fill="none" stroke="#9ca3af" stroke-width="1.2"/><rect x="308" y="8" width="542" height="44" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/><text x="579.0" y="37" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">IELTSPath</text><polyline points="158,83 158,126" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="283,150 345,150" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="555,150 595,150" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="579.0" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">No</text><polyline points="450,192 450,218" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="468" y="212.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Yes</text><polyline points="555,260 595,260" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="579.0" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">No</text><polyline points="450,302 450,330 158,330 158,339" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="468" y="322.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Yes</text><polyline points="158,401 158,470 345,470" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="555,470 595,470" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="579.0" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">No</text><polyline points="720,430 720,370 283,370" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="450,512 450,538" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="468" y="532.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Yes</text><polyline points="345,580 283,580" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="321.0" y="570" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">No</text><polyline points="33,580 14,580 14,370 33,370" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="450,622 450,659" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="468" y="642.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Yes</text><polyline points="450,721 450,757" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="158" cy="70" r="13" fill="#1f2937" stroke="#1f2937" stroke-width="1.6"/><rect x="33" y="126" width="250" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.6"/><text x="158" y="155" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Choose a lesson</text><polygon points="450,108 555,150 450,192 345,150" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="145.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Can the lesson</text><text x="450" y="164.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">be opened?</text><rect x="595" y="104" width="250" height="92" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="720" y="126.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Tell the learner why:</text><text x="720" y="145.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">an earlier lesson or practice</text><text x="720" y="164.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">is unfinished, a review is</text><text x="720" y="183.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">waiting, or it is not unlocked</text><polygon points="450,218 555,260 450,302 345,260" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="255.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Any hearts</text><text x="450" y="274.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">left?</text><rect x="595" y="229" width="250" height="62" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="720" y="255.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Wait for hearts to refill,</text><text x="720" y="274.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">or buy more with points</text><rect x="33" y="339" width="250" height="62" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.6"/><text x="158" y="365.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Study the lesson, do the</text><text x="158" y="384.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">exercises and submit</text><polygon points="450,428 555,470 450,512 345,470" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="465.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Did the answers</text><text x="450" y="484.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">arrive?</text><rect x="595" y="430" width="250" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="720" y="456" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Send again: the same result</text><text x="720" y="475" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">comes back and is never</text><text x="720" y="494" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">counted twice</text><polygon points="450,538 555,580 450,622 345,580" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="575.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Scored 70%</text><text x="450" y="594.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">or more?</text><rect x="33" y="549" width="250" height="62" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.6"/><text x="158" y="575.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Read the hints; each wrong</text><text x="158" y="594.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">answer costs a heart</text><rect x="315" y="659" width="270" height="62" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="450" y="685.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Finish the lesson and</text><text x="450" y="704.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">open the practice</text><circle cx="450" cy="770" r="13" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><circle cx="450" cy="770" r="7" fill="#1f2937" stroke="#1f2937" stroke-width="1.6"/></svg></div></body></html>
