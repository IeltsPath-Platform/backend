,345" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="579.0" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">No</text><polyline points="450,387 450,408" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="468" y="407.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Yes</text><polyline points="555,450 600,450" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="579.0" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">No</text><polyline points="840,450 846,450 846,250 283,250" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="450,492 450,531" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="468" y="512.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Yes</text><polyline points="310,555 283,555" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="158,586 158,623" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="263,665 305,665" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="287.0" y="655" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Yes</text><polyline points="158,707 158,733" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="176" y="727.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">No</text><polyline points="263,775 305,775" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="287.0" y="765" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">No</text><polyline points="158,817 158,846" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="176" y="837.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Yes</text><polyline points="158,894 158,931" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="450,799 450,912 158,912 158,931" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="283,955 305,955" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="450,979 450,1017" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="158" cy="70" r="13" fill="#1f2937" stroke="#1f2937" stroke-width="1.6"/><rect x="33" y="119" width="250" height="62" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.6"/><text x="158" y="145.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Open the test and answer</text><text x="158" y="164.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">a short survey</text><rect x="310" y="119" width="280" height="62" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="450" y="145.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Save the study goal and</text><text x="450" y="164.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">show the test levels</text><rect x="33" y="226" width="250" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.6"/><text x="158" y="255" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Choose a test level</text><polygon points="450,303 555,345 450,387 345,345" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="340.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Any tries left</text><text x="450" y="359.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">today?</text><rect x="600" y="314" width="240" height="62" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="720" y="340.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Say when the next try</text><text x="720" y="359.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">is possible</text><polygon points="450,408 555,450 450,492 345,450" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="445.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Is a test ready</text><text x="450" y="464.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">at this level?</text><rect x="600" y="419" width="240" height="62" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="720" y="445.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Ask the learner to choose</text><text x="720" y="464.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">another level</text><rect x="310" y="531" width="280" height="48" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="450" y="560" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Give the learner a test</text><rect x="33" y="524" width="250" height="62" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.6"/><text x="158" y="550.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Do Listening, Reading</text><text x="158" y="569.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">and Writing</text><polygon points="158,623 263,665 158,707 53,665" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="158" y="660.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Leaves before</text><text x="158" y="679.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">the end?</text><rect x="305" y="627" width="290" height="76" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="450" y="651" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Save the answers to continue</text><text x="450" y="670" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">later; a cancelled test</text><text x="450" y="689" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">does not use up a try</text><polygon points="158,733 263,775 158,817 53,775" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="158" y="770.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Can the learner</text><text x="158" y="789.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">record Speaking?</text><rect x="305" y="751" width="290" height="48" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="450" y="780" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Skip the Speaking part</text><rect x="33" y="846" width="250" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.6"/><text x="158" y="875" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Record the Speaking answers</text><rect x="33" y="931" width="250" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.6"/><text x="158" y="960" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Submit the test</text><rect x="305" y="931" width="290" height="48" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="450" y="960" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Go on to grading (BF-01b)</text><circle cx="450" cy="1030" r="13" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><circle cx="450" cy="1030" r="7" fill="#1f2937" stroke="#1f2937" stroke-width="1.6"/></svg></div></body></html>
