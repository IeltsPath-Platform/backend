<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BF-02c Topic test</title><style>body{margin:0;background:#ffffff}.wrap{overflow-x:auto}svg{min-width:858px;display:block}</style></head><body><div class="wrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 858 1130" width="858" height="1130" role="img" aria-labelledby="bf-02c-topic-test-title bf-02c-topic-test-desc" font-family="Segoe UI, Arial, sans-serif"><title id="bf-02c-topic-test-title">BF-02c Topic test</title><desc id="bf-02c-topic-test-desc">How a learner takes the final test of a topic and moves on.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f4e79"/></marker></defs><rect width="858" height="1130" fill="#ffffff"/><rect x="8" y="8" width="300" height="1114" fill="none" stroke="#9ca3af" stroke-width="1.2"/><rect x="8" y="8" width="300" height="44" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/><text x="158.0" y="37" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Learner</text><rect x="308" y="8" width="542" height="1114" fill="none" stroke="#9ca3af" stroke-width="1.2"/><rect x="308" y="8" width="542" height="44" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/><text x="579.0" y="37" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">IELTSPath</text><polyline points="450,83 450,118" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="555,160 595,160" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="579.0" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">No</text><polyline points="450,202 450,228" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="468" y="222.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Yes</text><polyline points="555,270 595,270" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="579.0" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Yes</text><polyline points="450,312 450,338" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="468" y="332.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">No</text><polyline points="555,380 595,380" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="579.0" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">No</text><polyline points="450,422 450,440 158,440 158,459" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="468" y="442.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Yes</text><polyline points="158,521 158,600 345,600" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="555,600 595,600" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="579.0" y="590" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">No</text><polyline points="720,560 720,490 283,490" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="450,642 450,668" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="468" y="662.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Yes</text><polyline points="555,710 595,710" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="579.0" y="700" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">No</text><polyline points="450,752 450,778" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="468" y="772.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Yes</text><polyline points="555,820 595,820" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="579.0" y="810" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">Yes</text><polyline points="450,862 450,896" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="468" y="882.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e79">No</text><polyline points="450,944 450,979" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="720,844 720,1010 575,1010" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="450,1041 450,1077" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="450" cy="70" r="13" fill="#1f2937" stroke="#1f2937" stroke-width="1.6"/><polygon points="450,118 555,160 450,202 345,160" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="155.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Does the topic</text><text x="450" y="174.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">have a test?</text><rect x="595" y="129" width="250" height="62" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="720" y="155.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">The topic is passed once</text><text x="720" y="174.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">all its lessons are done</text><polygon points="450,228 555,270 450,312 345,270" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="265.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Anything left to</text><text x="450" y="284.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">finish first?</text><rect x="595" y="239" width="250" height="62" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="720" y="265.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Tell the learner to finish</text><text x="720" y="284.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">lessons, practice or reviews</text><polygon points="450,338 555,380 450,422 345,380" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="375.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Is a test</text><text x="450" y="394.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">available?</text><rect x="595" y="349" width="250" height="62" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="720" y="375.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Tell the learner that no</text><text x="720" y="394.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">test is available now</text><rect x="33" y="459" width="250" height="62" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.6"/><text x="158" y="485.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Take the test</text><text x="158" y="504.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">and submit</text><polygon points="450,558 555,600 450,642 345,600" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="595.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Did the answers</text><text x="450" y="614.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">arrive?</text><rect x="595" y="560" width="250" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="720" y="586" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Send again: the same result</text><text x="720" y="605" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">comes back and is never</text><text x="720" y="624" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">counted twice</text><polygon points="450,668 555,710 450,752 345,710" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="705.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Could every answer</text><text x="450" y="724.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">be graded?</text><rect x="595" y="670" width="250" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="720" y="696" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Wait for an examiner; the</text><text x="720" y="715" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">learner is told when the</text><text x="720" y="734" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">result is ready</text><polygon points="450,778 555,820 450,862 345,820" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="815.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Scored 70%</text><text x="450" y="834.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">or more?</text><rect x="595" y="796" width="250" height="48" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="720" y="825" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Mark the topic as passed</text><rect x="325" y="896" width="250" height="48" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="450" y="925" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Mark the topic as completed</text><rect x="325" y="979" width="250" height="62" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="450" y="1015" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Open the next topic</text><circle cx="450" cy="1090" r="13" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><circle cx="450" cy="1090" r="7" fill="#1f2937" stroke="#1f2937" stroke-width="1.6"/></svg></div></body></html>
