ht="14" fill="#ffffff" fill-opacity="0.92"/><text x="1040.0" y="418" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">5: findLatestByAttemptId(attemptId)</text><line x1="1270" y1="458" x2="810" y2="458" stroke="#444444" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openm)"/><rect x="796.0" y="441" width="488.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="1040.0" y="452" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">latest version  (409 if this is not the latest, or the attempt is not SUBMITTED)</text><path d="M810,486 L851,486 L851,508 L812,508" fill="none" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><text x="859" y="494" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a">6: ExaminerGradingPolicy.complete(attemptId, resultId, items)</text><line x1="810" y1="554" x2="1035" y2="554" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="774.5" y="523" width="296.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="922.5" y="534" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">7: complete(attempt, result, items, gradedItems)</text><rect x="777.5" y="537" width="290.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="922.5" y="548" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">[propagation MANDATORY: joins this transaction]</text><path d="M1045,582 L1086,582 L1086,604 L1047,604" fill="none" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><text x="1094" y="590" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a">8: requireFullyGraded: every item has</text><text x="1094" y="604" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a">a score and a maximum score</text><line x1="1045" y1="650" x2="1270" y2="650" stroke="#444444" s