<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1204" width="1450" height="1204"><defs><marker id="solid" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><polygon points="0 0,11 4.5,0 9" fill="#444444"/></marker><marker id="openm" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#444444" stroke-width="1.4"/></marker></defs><rect width="1450" height="1204" fill="#ffffff"/><text x="725.0" y="28" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">Sequence: invalid events, retries and duplicates</text><line x1="100" y1="150" x2="100" y2="1184" stroke="#888888" stroke-width="1.2" stroke-dasharray="6,5"/><rect x="66" y="66" width="68" height="34" fill="#f5f5f5" stroke="#555" stroke-width="1.6"/><text x="100" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1a1a1a">&lt;&lt;external&gt;&gt;</text><text x="100" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">:RabbitMQ</text><line x1="350" y1="150" x2="350" y2="1184" stroke="#888888" stroke-width="1.2" stroke-dasharray="6,5"/><circle cx="350" cy="84" r="16" fill="#7fd6e0" stroke="#333" stroke-width="1.6"/><path d="M345,63 L353,68 L345,73" stroke="#333" stroke-width="1.6" fill="none"/><text x="350" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1a1a1a">&lt;&lt;listener&gt;&gt;</text><text x="350" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">:AssessmentCompletedListener</text><line x1="600" y1="150" x2="600" y2="1184" stroke="#888888" stroke-width="1.2" stroke-dasharray="6,5"/><circle cx="600" cy="84" r="16" fill="#7fd6e0" stroke="#333" stroke-width="1.6"/><path d="M595,63 L603,68 L595,73" stroke="#333" stroke-width="1.6" fill="none"/><text x="600" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1a1a1a">&lt;&lt;service&gt;&gt;</text><text x="600" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">:AssessmentCompletedParser</text><line x1="850" y1="150" x2="850" y2="1184" stroke="#888888" stroke-width="1.2" stroke-dasharray="6,5"/><circle cx="850" cy="84" r="16" fill="#7fd6e0" stroke="#333" stroke-width="1.6"/><path d="M845,63 L853,68 L845,73" stroke="#333" stroke-width="1.6" fill="none"/><text x="850" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1a1a1a">&lt;&lt;service&gt;&gt;</text><text x="850" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">:ApplyAssessmentResultUseCase</text><line x1="1100" y1="150" x2="1100" y2="1184" stroke="#888888" stroke-width="1.2" stroke-dasharray="6,5"/><circle cx="1100" cy="80" r="16" fill="#ff5a36" stroke="#333" stroke-width="1.6"/><line x1="1082" y1="98" x2="1118" y2="98" stroke="#333" stroke-width="1.8"/><text x="1100" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">:AssessmentResultVersion</text><line x1="1350" y1="150" x2="1350" y2="1184" stroke="#888888" stroke-width="1.2" stroke-dasharray="6,5"/><rect x="1316" y="66" width="68" height="34" fill="#f5f5f5" stroke="#555" stroke-width="1.6"/><text x="1350" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1a1a1a">&lt;&lt;queue&gt;&gt;</text><text x="1350" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">:DeadLetterQueue</text><rect x="595" y="256" width="10" height="42" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="1345" y="338" width="10" height="42" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="845" y="504" width="10" height="42" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="345" y="566" width="10" height="32" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="1095" y="864" width="10" height="42" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="845" y="830" width="10" height="110" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="1095" y="1030" width="10" height="42" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="845" y="1092" width="10" height="32" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="345" y="222" width="10" height="20" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="345" y="470" width="10" height="20" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="345" y="796" width="10" height="20" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="1345" y="698" width="10" height="20" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="95" y="406" width="10" height="20" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="95" y="634" width="10" height="20" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="95" y="732" width="10" height="20" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="95" y="966" width="10" height="20" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="1095" y="1160" width="10" height="20" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><line x1="40" y1="186" x2="1410" y2="186" stroke="#bbbbbb" stroke-width="1"/><rect x="443.0" y="176" width="564.0" height="20" fill="#ffffff"/><text x="725.0" y="191" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#555">Case 1: the message breaks the contract (not JSON, unknown type, bad field)</text><line x1="105" y1="226" x2="345" y2="226" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="191.0" y="209" width="68.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="225.0" y="220" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">1: deliver</text><line x1="355" y1="260" x2="595" y2="260" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="429.0" y="243" width="92.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="475.0" y="254" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">2: parse(body)</text><line x1="595" y1="294" x2="355" y2="294" stroke="#444444" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openm)"/><rect x="393.0" y="277" width="164.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="475.0" y="288" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">ContractViolationException</text><line x1="355" y1="342" x2="1345" y2="342" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="714.0" y="311" width="272.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="850.0" y="322" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">3: park: publish to the dead-letter exchange</text><rect x="717.0" y="325" width="266.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="850.0" y="336" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">header x-learning-failure = "contract: ..."</text><line x1="1345" y1="376" x2="355" y2="376" stroke="#444444" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openm)"/><rect x="795.0" y="359" width="110.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="850.0" y="370" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">publisher confirm</text><line x1="345" y1="410" x2="105" y2="410" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="77.0" y="393" width="296.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="225.0" y="404" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">4: basicAck  [the message leaves the main queue]</text><line x1="40" y1="434" x2="1410" y2="434" stroke="#bbbbbb" stroke-width="1"/><rect x="507.79999999999995" y="424" width="434.40000000000003" height="20" fill="#ffffff"/><text x="725.0" y="439" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#555">Case 2: applying fails (for example the database is down)</text><line x1="105" y1="474" x2="345" y2="474" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="191.0" y="457" width="68.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="225.0" y="468" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">5: deliver</text><line x1="355" y1="508" x2="845" y2="508" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="542.0" y="491" width="116.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="600.0" y="502" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">6: execute(result)</text><line x1="845" y1="542" x2="355" y2="542" stroke="#444444" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openm)"/><rect x="446.0" y="525" width="308.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="600.0" y="536" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">RuntimeException  (the transaction is rolled back)</text><path d="M355,570 L396,570 L396,592 L357,592" fill="none" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><text x="404" y="578" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a">7: attempt = previous failures (x-death) + 1</text><line x1="345" y1="638" x2="105" y2="638" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="134.0" y="607" width="182.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="225.0" y="618" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">8: basicNack(requeue = false)</text><rect x="50.0" y="621" width="350.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="225.0" y="632" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">-&gt; retry exchange -&gt; retry queue (TTL 30 s) -&gt; main queue</text><line x1="40" y1="662" x2="1410" y2="662" stroke="#bbbbbb" stroke-width="1"/><rect x="594.2" y="652" width="261.6" height="20" fill="#ffffff"/><text x="725.0" y="667" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#555">Case 3: the fifth failed delivery</text><line x1="355" y1="702" x2="1345" y2="702" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="681.0" y="685" width="338.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="850.0" y="696" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">9: park("exhausted after 5 attempts: &lt;exception type&gt;")</text><line x1="345" y1="736" x2="105" y2="736" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="185.0" y="719" width="80.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="225.0" y="730" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">10: basicAck</text><line x1="40" y1="760" x2="1410" y2="760" stroke="#bbbbbb" stroke-width="1"/><rect x="565.4" y="750" width="319.2" height="20" fill="#ffffff"/><text x="725.0" y="765" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#555">Case 4: the same event is delivered again</text><line x1="105" y1="800" x2="345" y2="800" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="119.0" y="783" width="212.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="225.0" y="794" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">11: deliver  (same result version)</text><line x1="355" y1="834" x2="845" y2="834" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="539.0" y="817" width="122.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="600.0" y="828" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">12: execute(result)</text><line x1="855" y1="868" x2="1095" y2="868" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="860.0" y="851" width="230.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="975.0" y="862" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">13: appliedVersion(userId, attemptId)</text><line x1="1095" y1="902" x2="855" y2="902" stroke="#444444" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openm)"/><rect x="899.0" y="885" width="152.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="975.0" y="896" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">version &gt;= resultVersion</text><line x1="845" y1="936" x2="355" y2="936" stroke="#444444" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openm)"/><rect x="494.0" y="919" width="212.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="600.0" y="930" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">nothing applied  (already applied)</text><line x1="345" y1="970" x2="105" y2="970" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="185.0" y="953" width="80.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="225.0" y="964" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">14: basicAck</text><line x1="40" y1="994" x2="1410" y2="994" stroke="#bbbbbb" stroke-width="1"/><rect x="533.0" y="984" width="384.0" height="20" fill="#ffffff"/><text x="725.0" y="999" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#555">Case 5: a regrade arrives (a higher resultVersion)</text><line x1="855" y1="1034" x2="1095" y2="1034" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="860.0" y="1017" width="230.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="975.0" y="1028" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">15: appliedVersion(userId, attemptId)</text><line x1="1095" y1="1068" x2="855" y2="1068" stroke="#444444" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openm)"/><rect x="923.0" y="1051" width="104.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="975.0" y="1062" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">an older version</text><path d="M855,1096 L896,1096 L896,1118 L857,1118" fill="none" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><text x="904" y="1104" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a">16: remove the old evidence and question events,</text><text x="904" y="1118" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a">apply the new result, rebuild mastery</text><line x1="855" y1="1164" x2="1095" y2="1164" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="824.0" y="1147" width="302.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="975.0" y="1158" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">17: recordVersion(userId, attemptId, new version)</text></svg>