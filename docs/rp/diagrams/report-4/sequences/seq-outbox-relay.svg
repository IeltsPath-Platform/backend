<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 870" width="1360" height="870"><defs><marker id="solid" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><polygon points="0 0,11 4.5,0 9" fill="#444444"/></marker><marker id="openm" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#444444" stroke-width="1.4"/></marker></defs><rect width="1360" height="870" fill="#ffffff"/><text x="680.0" y="28" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">Sequence: relay outbox events to RabbitMQ</text><rect x="40" y="242" width="1280" height="560" fill="#fcfcfc" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="7,4"/><rect x="40" y="242" width="115.0" height="18" fill="#eeeeee" stroke="#9a9a9a" stroke-width="1.2"/><text x="48" y="255" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#333">one transaction</text><line x1="100" y1="150" x2="100" y2="850" stroke="#888888" stroke-width="1.2" stroke-dasharray="6,5"/><circle cx="100" cy="84" r="16" fill="#7fd6e0" stroke="#333" stroke-width="1.6"/><path d="M95,63 L103,68 L95,73" stroke="#333" stroke-width="1.6" fill="none"/><text x="100" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1a1a1a">&lt;&lt;job&gt;&gt;</text><text x="100" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">:OutboxRelayScheduler</text><line x1="390" y1="150" x2="390" y2="850" stroke="#888888" stroke-width="1.2" stroke-dasharray="6,5"/><circle cx="390" cy="84" r="16" fill="#7fd6e0" stroke="#333" stroke-width="1.6"/><path d="M385,63 L393,68 L385,73" stroke="#333" stroke-width="1.6" fill="none"/><text x="390" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1a1a1a">&lt;&lt;service&gt;&gt;</text><text x="390" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">:OutboxRelay</text><line x1="680" y1="150" x2="680" y2="850" stroke="#888888" stroke-width="1.2" stroke-dasharray="6,5"/><circle cx="680" cy="80" r="16" fill="#ff5a36" stroke="#333" stroke-width="1.6"/><line x1="662" y1="98" x2="698" y2="98" stroke="#333" stroke-width="1.8"/><text x="680" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">:OutboxEvent</text><line x1="970" y1="150" x2="970" y2="850" stroke="#888888" stroke-width="1.2" stroke-dasharray="6,5"/><circle cx="970" cy="84" r="16" fill="#7fd6e0" stroke="#333" stroke-width="1.6"/><path d="M965,63 L973,68 L965,73" stroke="#333" stroke-width="1.6" fill="none"/><text x="970" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1a1a1a">&lt;&lt;service&gt;&gt;</text><text x="970" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">:RabbitOutboxEventPublisher</text><line x1="1260" y1="150" x2="1260" y2="850" stroke="#888888" stroke-width="1.2" stroke-dasharray="6,5"/><rect x="1226" y="66" width="68" height="34" fill="#f5f5f5" stroke="#555" stroke-width="1.6"/><text x="1260" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1a1a1a">&lt;&lt;external&gt;&gt;</text><text x="1260" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">:RabbitMQ</text><rect x="675" y="308" width="10" height="42" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="965" y="434" width="10" height="32" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="1255" y="516" width="10" height="42" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="965" y="406" width="10" height="186" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="1255" y="682" width="10" height="42" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="385" y="222" width="10" height="20" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="675" y="618" width="10" height="20" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><rect x="675" y="784" width="10" height="20" fill="#9aab3c" stroke="#5b6b1a" stroke-width="1.2"/><line x1="40" y1="186" x2="1320" y2="186" stroke="#bbbbbb" stroke-width="1"/><rect x="293.59999999999997" y="176" width="772.8000000000001" height="20" fill="#ffffff"/><text x="680.0" y="191" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#555">Every 2 seconds (poll-interval); OutboxRelayNudge also runs it right after a commit that recorded events</text><line x1="105" y1="226" x2="385" y2="226" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="169.0" y="209" width="152.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="245.0" y="220" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">1: publishPendingBatch()</text><line x1="395" y1="312" x2="675" y2="312" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="450.0" y="267" width="170.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="535.0" y="278" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">2: claimUnpublished(50, 20)</text><rect x="390.0" y="281" width="290.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="535.0" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">WHERE published_at IS NULL AND retry_count &lt; 20</text><rect x="402.0" y="295" width="266.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="535.0" y="306" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">ORDER BY created_at  FOR UPDATE SKIP LOCKED</text><line x1="675" y1="346" x2="395" y2="346" stroke="#444444" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openm)"/><rect x="330.0" y="329" width="410.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="535.0" y="340" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">pending events (rows locked, so two relays never take the same one)</text><line x1="40" y1="370" x2="1320" y2="370" stroke="#bbbbbb" stroke-width="1"/><rect x="588.8" y="360" width="182.4" height="20" fill="#ffffff"/><text x="680.0" y="375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#555">For each claimed event</text><line x1="395" y1="410" x2="965" y2="410" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="625.0" y="393" width="110.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="680.0" y="404" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">3: publish(event)</text><path d="M975,438 L1016,438 L1016,460 L977,460" fill="none" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><text x="1024" y="446" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a">4: routing key from the event type</text><text x="1024" y="460" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a">(AssessmentCompleted.v2 -&gt; assessment.completed.v2)</text><line x1="975" y1="520" x2="1255" y2="520" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="934.0" y="489" width="362.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="1115.0" y="500" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">5: send(exchange "assessment.events", routing key, message)</text><rect x="997.0" y="503" width="236.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="1115.0" y="514" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">messageId = event id, JSON, persistent</text><line x1="1255" y1="554" x2="975" y2="554" stroke="#444444" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openm)"/><rect x="988.0" y="537" width="254.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="1115.0" y="548" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">publisher confirm: ack  (waits up to 5 s)</text><line x1="965" y1="588" x2="395" y2="588" stroke="#444444" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openm)"/><rect x="649.0" y="571" width="62.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="680.0" y="582" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">published</text><line x1="395" y1="622" x2="675" y2="622" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="456.0" y="605" width="158.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="535.0" y="616" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">6: markPublished(id, now)</text><line x1="40" y1="646" x2="1320" y2="646" stroke="#bbbbbb" stroke-width="1"/><rect x="423.2" y="636" width="513.6" height="20" fill="#ffffff"/><text x="680.0" y="651" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#555">If the broker does not confirm, rejects, or cannot route the message</text><line x1="975" y1="686" x2="1255" y2="686" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="994.0" y="669" width="242.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="1115.0" y="680" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">7: send(exchange, routing key, message)</text><line x1="1255" y1="720" x2="975" y2="720" stroke="#444444" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openm)"/><rect x="973.0" y="703" width="284.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="1115.0" y="714" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">nack, timeout, or returned (no queue is bound)</text><line x1="965" y1="754" x2="395" y2="754" stroke="#444444" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openm)"/><rect x="610.0" y="737" width="140.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="680.0" y="748" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">PublishFailedException</text><line x1="395" y1="788" x2="675" y2="788" stroke="#444444" stroke-width="1.4" marker-end="url(#solid)"/><rect x="390.0" y="771" width="290.0" height="14" fill="#ffffff" fill-opacity="0.92"/><text x="535.0" y="782" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a">8: recordFailure(id, error)   [retry_count + 1]</text><rect x="236.7" y="810" width="596.6" height="22" fill="#fff9c4" stroke="#d6b656" stroke-width="1.2"/><text x="535.0" y="824" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#333">the row stays unpublished and is claimed again on the next tick, until retry_count reaches 20</text></svg>