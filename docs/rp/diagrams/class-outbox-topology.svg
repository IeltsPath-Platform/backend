<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 860" width="1700" height="860"><defs><marker id="open" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#444444" stroke-width="1.4"/></marker><marker id="tri" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M1,1 L13,6 L1,11 Z" fill="#ffffff" stroke="#444444" stroke-width="1.4"/></marker><marker id="dia" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 Z" fill="#444444" stroke="#444444" stroke-width="1"/></marker></defs><rect width="1700" height="860" fill="#ffffff"/><text x="850.0" y="26" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">RabbitMQ topology of the AssessmentCompleted event</text><rect x="40" y="300" width="270" height="84" fill="#ffffff" stroke="#9673a6" stroke-width="1.6"/><rect x="40" y="300" width="270" height="42" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.6"/><text x="175.0" y="317" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">&lt;&lt;assessment-service&gt;&gt;</text><text x="175.0" y="332" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">RabbitOutboxEventPublisher</text><text x="50" y="358" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">persistent message,</text><text x="50" y="374" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">messageId = outbox event id</text><rect x="380" y="300" width="260" height="84" fill="#ffffff" stroke="#d6b656" stroke-width="1.6"/><rect x="380" y="300" width="260" height="42" fill="#fff2cc" stroke="#d6b656" stroke-width="1.6"/><text x="510.0" y="317" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">&lt;&lt;topic exchange, durable&gt;&gt;</text><text x="510.0" y="332" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">assessment.events</text><text x="390" y="358" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">routing key</text><text x="390" y="374" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">assessment.completed.v2</text><rect x="720" y="70" width="360" height="68" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.6"/><rect x="720" y="70" width="360" height="42" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.6"/><text x="900.0" y="87" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">&lt;&lt;queue&gt;&gt;</text><text x="900.0" y="102" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">notification.assessment-result-ready.v2</text><text x="730" y="128" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">bound to the assessment.events exchange</text><rect x="1220" y="70" width="400" height="84" fill="#ffffff" stroke="#9673a6" stroke-width="1.6"/><rect x="1220" y="70" width="400" height="42" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.6"/><text x="1420.0" y="87" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">&lt;&lt;notification-service&gt;&gt;</text><text x="1420.0" y="102" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">AssessmentResultReadyListener</text><text x="1230" y="128" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">reads the same event for the</text><text x="1230" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">"result ready" notice</text><rect x="720" y="300" width="360" height="68" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.6"/><rect x="720" y="300" width="360" height="42" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.6"/><text x="900.0" y="317" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">&lt;&lt;queue, durable&gt;&gt;</text><text x="900.0" y="332" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">learning.assessment-completed.v2</text><text x="730" y="358" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">dead-letters to the retry exchange</text><rect x="1220" y="300" width="400" height="84" fill="#ffffff" stroke="#9673a6" stroke-width="1.6"/><rect x="1220" y="300" width="400" height="42" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.6"/><text x="1420.0" y="317" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">&lt;&lt;learning-service, manual ack&gt;&gt;</text><text x="1420.0" y="332" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">AssessmentCompletedListener</text><text x="1230" y="358" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">ack when applied</text><text x="1230" y="374" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">nack (no requeue) when it fails</text><rect x="380" y="560" width="260" height="50" fill="#ffffff" stroke="#d6b656" stroke-width="1.6"/><rect x="380" y="560" width="260" height="42" fill="#fff2cc" stroke="#d6b656" stroke-width="1.6"/><text x="510.0" y="577" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">&lt;&lt;direct exchange&gt;&gt;</text><text x="510.0" y="592" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">learning.assessment-completed.retry</text><rect x="380" y="700" width="440" height="84" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.6"/><rect x="380" 