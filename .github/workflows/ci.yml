name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Maven reactor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers tests are skipped when Docker is missing; fail fast instead of passing without them.
      - name: Check Docker for Testcontainers
        run: docker info --format 'Docker {{.ServerVersion}}'

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Placeholder values only: compose needs the variables to interpolate, nothing is started.
      - name: Create placeholder .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-placeholder
          RABBITMQ_USERNAME=ci-placeholder
          RABBITMQ_PASSWORD=ci-placeholder
          EXTERNAL_JWT_SECRET=Y2ktcGxhY2Vob2xkZXItZXh0ZXJuYWwtand0LXNlY3JldA==
          GATEWAY_INTERNAL_JWT_SECRET=Y2ktcGxhY2Vob2xkZXItaW50ZXJuYWwtand0LXNlY3JldA==
          EOF

      - name: docker compose config
        run: docker compose config --quiet
