name: Images

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: images-main
  cancel-in-progress: true

jobs:
  validate-production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - run: python3 scripts/production/test-production.py
  publish:
    needs: validate-production
    # workflow_run has privileged credentials: never build a PR/fork commit here.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module:
          - infra/config-server
          - infra/eureka-server
          - infra/api-gateway
          - services/user-service
          - services/content-service
          - services/library-service
          - services/assessment-service
          - services/access-service
          - services/learning-service
          - services/game-service
          - services/notification-service
          - services/community-service
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Image metadata
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          MODULE: ${{ matrix.module }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          echo "name=ghcr.io/${OWNER,,}/ieltspath-${MODULE##*/}" >> "$GITHUB_OUTPUT"
          if [ "$MODULE" = infra/config-server ]; then
            echo 'dockerfile=infra/config-server/Dockerfile' >> "$GITHUB_OUTPUT"
          else
            echo 'dockerfile=Dockerfile.spring-service' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve an existing SHA image
        id: existing
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$COMMIT" > /dev/null 2> "$RUNNER_TEMP/image-lookup-error"; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|manifest unknown' "$RUNNER_TEMP/image-lookup-error"; then
            echo 'found=false' >> "$GITHUB_OUTPUT"
          else
            echo 'Registry lookup failed; refusing to risk overwriting an existing SHA tag.'
            exit 1
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.found != 'true'
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          build-args: MODULE_PATH=${{ matrix.module }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
      - name: Move main only when this is still the main branch head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$latest" = "$COMMIT" ]; then
            docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE:$COMMIT"
          fi
