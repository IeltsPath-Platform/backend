spring:
  datasource:
    url: ${LIBRARY_DB_URL:jdbc:postgresql://localhost:5440/library_db}
    username: ${LIBRARY_DB_USERNAME:postgres}
    password: ${LIBRARY_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${LIBRARY_DB_POOL_MAX_SIZE:5}
      minimum-idle: ${LIBRARY_DB_POOL_MIN_IDLE:1}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # db/callback holds afterMigrate__demo_data.sql: demo learner data written only when DEMO_DATA_ENABLED=true
    # (dev/demo databases).
    locations: classpath:db/migration,classpath:db/callback
    placeholders:
      demoData: ${DEMO_DATA_ENABLED:false}
      # The learner the demo data belongs to: h2 by default; set DEMO_LEARNER_ID to give it to an existing account.
      demoUserId: ${DEMO_LEARNER_ID:00000000-0000-0000-0000-000000000003}
  # Library publishes review reminders over RabbitMQ; the relay needs publisher confirms and mandatory routing.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

app:
  storage:
    enabled: true
    supabase:
      url: ${SUPABASE_URL:}
      secret-key: ${SUPABASE_SECRET_KEY:}
  auth:
    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET}
  security:
    public-endpoints:
      - method: GET
        patterns:
          - /actuator/health
          - /actuator/info
          - /v3/api-docs
          - /v3/api-docs/**
      - method: GET
        patterns:
          - /api/content/vocabulary
          - "/api/content/vocabulary/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}"
          - /api/content/vocabulary/suggestions
          - /api/content/vocabulary/topics
          - "/api/content/vocabulary/topics/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}/units"
          - "/api/content/vocabulary/units/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}"
          - /api/content/vocabulary/sets
          - /api/content/vocabulary/mindmap
          - "/api/content/vocabulary/sets/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}"
          - "/api/content/vocabulary/sets/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}/words"

library:
  # Daily reminder to learners who have saved words due for review; Notification turns it into an inbox notice.
  review-due:
    enabled: ${LIBRARY_REVIEW_DUE_ENABLED:true}
    cron: "0 0 8 * * *"
    zone: Asia/Ho_Chi_Minh
    min-count: 5
  # Outbox relay: publishes the events above to Notification.
  outbox:
    relay:
      enabled: ${LIBRARY_OUTBOX_RELAY_ENABLED:true}
      batch-size: 50
      max-attempts: 20
      poll-interval: PT2S
      confirm-timeout: PT5S
  access:
    base-url: ${ACCESS_SERVICE_URL:http://localhost:8084}
  vocabulary-study:
    xp:
      first-completion: 20
      perfect-bonus: 10
      level-xp: 500
    hearts:
      max: 5
      premium-max: 7
      regen-hours: 5
      refill-cost: 5
      plan-refresh-minutes: 10
    streak:
      freeze-price: 10
      max-consecutive-freezes: 5
    default-timezone: Asia/Ho_Chi_Minh
  vocabulary:
    weekly-goal-default: 120
  flashcard-images:
    bucket: ${LIBRARY_FLASHCARD_BUCKET:flashcards}
  catalog-media:
    # Public bucket for vocabulary sense pictures and pronunciation audio; the same bucket holds the listening audio.
    bucket: ${LIBRARY_CATALOG_MEDIA_BUCKET:media}

springdoc:
  # OpenAPI for the Gateway Swagger UI; set API_DOCS_ENABLED=false outside local development.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/learning-support/vocabulary-study/**
    - /api/content/videos/**
    - /api/content/vocabulary/**
    - /api/content/admin/vocabulary/**
    - /api/learning-support/flashcards/**
    - /api/learning-support/decks/**
    - /api/learning-support/notes/**
    - /api/learning-support/video-progress/**
    - /api/learning-support/saved-segments/**
    - /api/learning-support/video-dictation/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  endpoint:
    health:
      probes:
        enabled: true
