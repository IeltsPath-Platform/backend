spring:
  datasource:
    url: ${LIBRARY_DB_URL:jdbc:postgresql://localhost:5437/library_db}
    username: ${LIBRARY_DB_USERNAME:postgres}
    password: ${LIBRARY_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

app:
  storage:
    enabled: true
    supabase:
      url: ${SUPABASE_URL:}
      secret-key: ${SUPABASE_SECRET_KEY:}
  auth:
    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET}
  security:
    public-endpoints:
      - method: GET
        patterns:
          - /actuator/health
          - /actuator/info
          - /v3/api-docs
          - /v3/api-docs/**
      - method: GET
        patterns:
          - /api/content/vocabulary
          - "/api/content/vocabulary/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}"
          - /api/content/vocabulary/suggestions
          - /api/content/vocabulary/topics
          - /api/content/vocabulary/sets
          - /api/content/vocabulary/mindmap
          - "/api/content/vocabulary/sets/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}"
          - "/api/content/vocabulary/sets/{id:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}}/words"

library:
  content:
    base-url: ${CONTENT_SERVICE_URL:http://localhost:8082}
  flashcard-images:
    bucket: ${LIBRARY_FLASHCARD_BUCKET:flashcards}

springdoc:
  # OpenAPI for the Gateway Swagger UI; set API_DOCS_ENABLED=false outside local development.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/content/videos/**
    - /api/content/vocabulary/**
    - /api/content/admin/vocabulary/**
    - /api/learning-support/flashcards/**
    - /api/learning-support/decks/**
    - /api/learning-support/notes/**
    - /api/learning-support/video-progress/**
    - /api/learning-support/saved-segments/**
    - /api/learning-support/video-dictation/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      probes:
        enabled: true
