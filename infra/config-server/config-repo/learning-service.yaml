spring:
  servlet:
    multipart:
      # One Speaking recording per request: 10 MB file (the bucket's limit, about 5 minutes of WAV), a little headroom for
      # the multipart envelope.
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${LEARNING_DB_URL:jdbc:postgresql://localhost:5440/learning_db}
    username: ${LEARNING_DB_USERNAME:postgres}
    password: ${LEARNING_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD}

app:
  auth:
    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET}
  # Object storage for Speaking recordings. Blank url and key keep the service running; storing a recording then answers 503.
  storage:
    enabled: true
    supabase:
      url: ${SUPABASE_URL:}
      secret-key: ${SUPABASE_SECRET_KEY:}
  security:
    public-endpoints:
      - method: GET
        patterns:
          - /actuator/health
          - /actuator/info
          - /v3/api-docs
          - /v3/api-docs/**

learning:
  assessment:
    base-url: ${ASSESSMENT_SERVICE_URL:http://localhost:8083}
  content:
    base-url: ${CONTENT_SERVICE_URL:http://localhost:8082}
  access:
    base-url: ${ACCESS_SERVICE_URL:http://localhost:8084}
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8085}
  # OpenAI-compatible chat completions used to grade lesson essays. Blank values turn grading off (503).
  llm:
    base-url: ${LEARNING_LLM_BASE_URL:}
    api-key: ${LEARNING_LLM_API_KEY:}
    model: ${LEARNING_LLM_MODEL:}
    reasoning-effort: ${LEARNING_LLM_REASONING_EFFORT:}
    max-tokens: ${LEARNING_LLM_MAX_TOKENS:8192}
  writing:
    point-cost: ${LEARNING_WRITING_POINT_COST:3}
    # LLM gradings per learner and calendar day in quota-timezone.
    daily-grading-limit: ${LEARNING_WRITING_DAILY_GRADING_LIMIT:10}
    quota-timezone: Asia/Ho_Chi_Minh
    grading-timeout-seconds: 20
    # Band caps stay off until an examiner has set the thresholds. A cap left blank switches its rule off.
    band-caps-enabled: ${LEARNING_WRITING_BAND_CAPS_ENABLED:false}
    too-short-band-cap: ${LEARNING_WRITING_TOO_SHORT_BAND_CAP:}
    off-topic-band-cap: ${LEARNING_WRITING_OFF_TOPIC_BAND_CAP:}
    no-overview-band-cap: ${LEARNING_WRITING_NO_OVERVIEW_BAND_CAP:}
    partial-answer-band-cap: ${LEARNING_WRITING_PARTIAL_ANSWER_BAND_CAP:}
    no-position-band-cap: ${LEARNING_WRITING_NO_POSITION_BAND_CAP:}
  # Azure Speech: transcript and pronunciation scores of a Speaking recording. The key lives only in .env. Blank key or
  # region turns the analysis off; storing recordings still works. locale en-US also gives an intonation score.
  speech:
    key: ${LEARNING_SPEECH_KEY:}
    region: ${LEARNING_SPEECH_REGION:}
    locale: ${LEARNING_SPEECH_LOCALE:en-US}
    timeout-seconds: 180
    max-concurrent: 2
  # AI-graded Speaking practice. Recordings live in the shared bucket under practice/{userId}/{date}_{submissionId}/.
  speaking:
    # Off by default: the grading charges points, and the starter rubric and the interim pronunciation band table have not
    # been calibrated against examiner scores. Set LEARNING_SPEAKING_ENABLED=true in .env to try it. Even then learners
    # are offered it only while Azure Speech and the LLM are configured (see SpeakingAvailability).
    enabled: ${LEARNING_SPEAKING_ENABLED:false}
    point-cost: ${LEARNING_SPEAKING_POINT_COST:5}
    bucket: ${LEARNING_SPEAKING_BUCKET:speaking-recordings}
    # Must not be above the size limit of the bucket on Supabase.
    max-recording-bytes: 10485760
    upload-stale-seconds: 1800
    retention-days: ${LEARNING_SPEAKING_RETENTION_DAYS:90}
    timezone: Asia/Ho_Chi_Minh
    daily-grading-limit: ${LEARNING_SPEAKING_DAILY_LIMIT:5}
    # A row being graded that has not changed for this long is taken over, and a grading that failed waits this long before
    # it is tried again. The job signals progress after every recording, so this only has to cover one step (analysing
    # one recording, or the LLM call), not the whole submission.
    stale-after-seconds: 300
    max-attempts: 3
    pass-band: 6.0
    max-input-chars: 60000
    history-min-evidence: 3
    history-max-kps: 5
    history-extra-kp-codes: ${LEARNING_SPEAKING_HISTORY_EXTRA_KP_CODES:}
    history-trend-window: 5
    history-max-age-days: 90
    # Interim caps, to be fixed with the examiners: bands are lowered when the answer is too short, off topic or not English.
    min-total-words: 30
    too-short-band-cap: 5.0
    off-topic-band-cap: 4.0
    not-english-band-cap: 3.0
  error-trap:
    review-limit: 1
  # Older name of mastery.priority-below; it is the default for that key.
  review-mastery-threshold: 0.6
  # Default mastery tiers and review schedule. Admin overrides win (PUT /api/learning/admin/rule-configs). The review
  # schedule is a convention, not tuned against learner data.
  mastery:
    priority-below: ${learning.review-mastery-threshold}
    maintain-from: 0.8
    # A maintained point is reviewed after review-intervals-days[success streak] days, capped at the last entry.
    review-intervals-days: 7,14,30,45,60
    consolidate-days: 3
    # Fill profiles for evidence that predates them after startup; idempotent.
    backfill-on-startup: true
    # DEEPTUTOR (last five answers, no decay) or MP1 (below). MP1 is the default here (confirmed 2026-10-18). Switching
    # the formula changes every learner's tier: rebuild all profiles once after a switch (rebuild-on-startup, or the
    # Admin recompute). Set LEARNING_MASTERY_POLICY=DEEPTUTOR to go back.
    policy: ${LEARNING_MASTERY_POLICY:MP1}
    rebuild-on-startup: ${LEARNING_MASTERY_REBUILD_ON_STARTUP:false}
  free-practice:
    # Unseen practice sets per knowledge point kept for reviews: free practice starts only above this count.
    reserve: 2
    # MP1 scores fall as evidence ages; the job refreshes learners who have not answered for decay-stale-after.
    decay-enabled: true
    decay-stale-after: PT24H
    decay-interval: P1D
    mp1:
      window: 8
      max-practice-in-window: 3
      half-life-days: 30
      min-evidence: 3
      min-distinct-days: 2
      min-confidence: 1.0
      hysteresis: 0.03
      same-item-days: 7
      source-weights:
        exam: 1.0
        review: 1.0
        probe: 1.0
        practice: 0.6
        essay: 0.5
        error-trap: 0.3
        # An examiner's band and marked errors (standalone Writing review): between an AI essay (0.5) and a test (1.0).
        human-review: 0.75
  gamification:
    # Learner timezone when none is chosen; the daily XP cap resets at its midnight.
    default-timezone: ${LEARNING_DEFAULT_TIMEZONE:Asia/Ho_Chi_Minh}
    xp:
      # XP of a correct first answer by its difficulty tag; an untagged question gets unknown.
      easy: 10
      medium: 15
      hard: 20
      unknown: 10
      # Answer XP counted per learner day; the rest is kept as shadow XP.
      daily-cap: 100
      # XP for each level: level = 1 + total / level-xp.
      level-xp: 1000
      # One-time milestones per knowledge point: reaching consolidate, then maintain.
      kp-consolidate: 25
      kp-maintain: 50
    hearts:
      # Hearts for the standard plan and for PREMIUM; one comes back every five hours below the maximum.
      max: 5
      premium-max: 7
      # Points for a full refill.
      refill-cost: 5
    quests:
      # Daily quests: answers needed and the reward of each. Points are paid through the reward queue.
      practice-required: 5
      practice-xp: 20
      practice-points: 5
      weakness-required: 3
      weakness-xp: 30
      # The longer practice quest that replaces the weakness quest when no point suits.
      plus-required: 10
      plus-xp: 30
      streak-xp: 10
  rewards:
    # Points owed to learners (streak, quests, badges) go to Access over RabbitMQ. A grant with no answer after resend-after
    # is sent again; after max-sends sends it is given up and kept as failed.
    relay-enabled: true
    batch: 100
    resend-after: PT5M
    max-sends: 10
    # Points for the first time a knowledge point reaches this mastery through practice.
    kp-mastered:
      threshold: 0.9
      points: 5
  messaging:
    # AssessmentCompleted.v2 consumer: delay before a failed event is retried, and attempts before the DLQ.
    retry-delay-ms: ${LEARNING_RETRY_DELAY_MS:30000}
    max-delivery-attempts: ${LEARNING_MAX_DELIVERY_ATTEMPTS:5}
    consumer-enabled: ${LEARNING_CONSUMER_ENABLED:true}

springdoc:
  # OpenAPI for the Gateway Swagger UI; set API_DOCS_ENABLED=false outside local development.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/learning/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  endpoint:
    health:
      probes:
        enabled: true
