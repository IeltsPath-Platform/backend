spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5440/notification_db}
    username: ${NOTIFICATION_DB_USERNAME:postgres}
    password: ${NOTIFICATION_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          connectiontimeout: 3000
          timeout: 5000
          writetimeout: 5000

app:
  auth:
    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  security:
    public-endpoints:
      - method: GET
        patterns:
          - /actuator/health
          - /actuator/info
          - /mail/unsubscribe

notification:
  retention:
    cleanup-interval: ${NOTIFICATION_RETENTION_CLEANUP_INTERVAL:PT6H}
    initial-delay: ${NOTIFICATION_RETENTION_INITIAL_DELAY:PT2M}
    batch-size: ${NOTIFICATION_RETENTION_BATCH_SIZE:500}
  mail:
    enabled: ${NOTIFICATION_MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    frontend-base-url: ${FRONTEND_BASE_URL:}
    templates:
      password-reset:
        enabled: ${NOTIFICATION_MAIL_PASSWORD_RESET_ENABLED:true}
      password-changed:
        enabled: ${NOTIFICATION_MAIL_PASSWORD_CHANGED_ENABLED:true}
      google-account-linked:
        enabled: ${NOTIFICATION_MAIL_GOOGLE_ACCOUNT_LINKED_ENABLED:true}
      email-verification:
        enabled: ${NOTIFICATION_MAIL_EMAIL_VERIFICATION_ENABLED:true}
      subscription-expiring:
        enabled: ${NOTIFICATION_MAIL_SUBSCRIPTION_EXPIRING_ENABLED:true}
      subscription-expired:
        enabled: ${NOTIFICATION_MAIL_SUBSCRIPTION_EXPIRED_ENABLED:true}
      essay-graded:
        enabled: ${NOTIFICATION_MAIL_ESSAY_GRADED_ENABLED:true}
      grading-overdue:
        enabled: ${NOTIFICATION_MAIL_GRADING_OVERDUE_ENABLED:true}
      result-ready:
        enabled: ${NOTIFICATION_MAIL_RESULT_READY_ENABLED:true}
      examiner-due-soon:
        enabled: ${NOTIFICATION_MAIL_EXAMINER_DUE_SOON_ENABLED:true}
      examiner-new-jobs:
        enabled: ${NOTIFICATION_MAIL_EXAMINER_NEW_JOBS_ENABLED:true}
      subscription-granted:
        enabled: ${NOTIFICATION_MAIL_SUBSCRIPTION_GRANTED_ENABLED:true}
    unsubscribe-secret: ${NOTIFICATION_MAIL_UNSUBSCRIBE_SECRET:}
    api-base-url: ${NOTIFICATION_API_BASE_URL:http://localhost:8080}
  push:
    enqueue-enabled: ${NOTIFICATION_PUSH_ENQUEUE_ENABLED:false}
    worker-enabled: ${NOTIFICATION_PUSH_WORKER_ENABLED:false}
    poll-interval: ${NOTIFICATION_PUSH_POLL_INTERVAL:PT1S}
    firebase:
      project-id: ${FIREBASE_PROJECT_ID:}
      android-channel-id: ${FIREBASE_ANDROID_CHANNEL_ID:default}

resilience4j:
  circuitbreaker:
    instances:
      fcm:
        failure-rate-threshold: 50
        minimum-number-of-calls: 10
        sliding-window-size: 20
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
  bulkhead:
    instances:
      fcm:
        max-concurrent-calls: 4
        max-wait-duration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  endpoint:
    health:
      probes:
        enabled: true

