spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5440/notification_db}
    username: ${NOTIFICATION_DB_USERNAME:postgres}
    password: ${NOTIFICATION_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

app:
  auth:
    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  security:
    public-endpoints:
      - method: GET
        patterns:
          - /actuator/health
          - /actuator/info

notification:
  push:
    enqueue-enabled: ${NOTIFICATION_PUSH_ENQUEUE_ENABLED:false}
    worker-enabled: ${NOTIFICATION_PUSH_WORKER_ENABLED:false}
    poll-interval: ${NOTIFICATION_PUSH_POLL_INTERVAL:PT1S}
    firebase:
      project-id: ${FIREBASE_PROJECT_ID:}
      android-channel-id: ${FIREBASE_ANDROID_CHANNEL_ID:default}

resilience4j:
  circuitbreaker:
    instances:
      fcm:
        failure-rate-threshold: 50
        minimum-number-of-calls: 10
        sliding-window-size: 20
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
  bulkhead:
    instances:
      fcm:
        max-concurrent-calls: 4
        max-wait-duration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  endpoint:
    health:
      probes:
        enabled: true

