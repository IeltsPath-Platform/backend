spring:
  datasource:
    url: ${GAME_DB_URL:jdbc:postgresql://localhost:5435/game_db}
    username: ${GAME_DB_USERNAME:postgres}
    password: ${GAME_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  auth:
    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET}
  security:
    public-endpoints:
      - method: GET
        patterns:
          - /actuator/health
          - /actuator/info
          - /ws/games

game:
  content:
    base-url: ${CONTENT_SERVICE_URL:http://content-service:8082}
  websocket:
    allowed-origins: ${GAME_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      probes:
        enabled: true

