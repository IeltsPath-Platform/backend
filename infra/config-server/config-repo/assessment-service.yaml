spring:
  datasource:
    url: ${ASSESSMENT_DB_URL:jdbc:postgresql://localhost:5432/assessment_db}
    username: ${ASSESSMENT_DB_USERNAME:postgres}
    password: ${ASSESSMENT_DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # An outbox row is marked published only after a positive confirm for a routed message.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

assessment:
  llm-grading:
    enabled: true
    base-url: ${ASSESSMENT_LLM_BASE_URL:}
    api-key: ${ASSESSMENT_LLM_API_KEY:}
    model: ${ASSESSMENT_LLM_MODEL:}
    poll-interval: PT5S
    batch-size: 10
    daily-limit: ${ASSESSMENT_LLM_DAILY_LIMIT:20}
    stuck-after: PT10M
    quota-timezone: Asia/Ho_Chi_Minh
  ai-eval:
    daily-limit: ${ASSESSMENT_AI_EVAL_DAILY_LIMIT:100}
    min-within-half-band: ${ASSESSMENT_AI_EVAL_MIN_WITHIN_HALF_BAND:0.80}
    min-qwk: ${ASSESSMENT_AI_EVAL_MIN_QWK:0.60}
    quota-timezone: Asia/Ho_Chi_Minh
  content:
    base-url: ${CONTENT_SERVICE_URL:http://localhost:8082}
  user:
    # Display names of examiners in the quality table; the table is still returned when this service is down.
    base-url: ${USER_SERVICE_URL:http://localhost:8085}
  messaging:
    exchange: ${ASSESSMENT_EVENTS_EXCHANGE:assessment.events}
  outbox:
    relay:
      enabled: ${ASSESSMENT_OUTBOX_RELAY_ENABLED:true}
      poll-interval: PT2S
      batch-size: 50
      max-attempts: 20
      confirm-timeout: PT5S

app:
  auth:
    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET:HK5r8WcYA8J8jo2ruIBCEXRcHhUfSDUqP16H29P1sxo=}
  security:
    public-endpoints:
      - method: GET
        patterns:
          - /actuator/health
          - /actuator/info
          - /v3/api-docs
          - /v3/api-docs/**

springdoc:
  # OpenAPI for the Gateway Swagger UI; set API_DOCS_ENABLED=false outside local development.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/assessments/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      probes:
        enabled: true

