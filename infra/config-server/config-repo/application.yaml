eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://alloy:4318/v1/traces}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-failure-predicate: com.ieltspath.commonresilience.ResilientCall$TransientHttpFailure
    instances:
      content: { base-config: default }
      access: { base-config: default }
      user: { base-config: default }
      assessment: { base-config: default }
      library: { base-config: default }
      learning: { base-config: default }
      llm: { base-config: default, slow-call-duration-threshold: 60s }
  retry:
    configs:
      default:
        max-attempts: 2
        wait-duration: 200ms
        retry-exception-predicate: com.ieltspath.commonresilience.ResilientCall$TransientHttpFailure
    instances:
      content: { base-config: default }
      access: { base-config: default }
      user: { base-config: default }
      assessment: { base-config: default }
      library: { base-config: default }
      learning: { base-config: default }
  bulkhead:
    instances:
      llm: { max-concurrent-calls: 4, max-wait-duration: 0 }

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
