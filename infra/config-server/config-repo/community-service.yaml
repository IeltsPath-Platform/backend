spring:
  datasource:
    url: ${COMMUNITY_DB_URL:jdbc:postgresql://localhost:5432/community_db}
    username: ${COMMUNITY_DB_USERNAME:postgres}
    password: ${COMMUNITY_DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

community:
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8085}
  media:
    image-hosts: ${COMMUNITY_IMAGE_HOSTS:images.unsplash.com,i.imgur.com}
    video-hosts: ${COMMUNITY_VIDEO_HOSTS:youtube.com,www.youtube.com,youtu.be,loom.com,www.loom.com,drive.google.com}
  messaging:
    exchange: community.events
  outbox:
    relay:
      enabled: ${COMMUNITY_OUTBOX_RELAY_ENABLED:true}
      poll-interval: PT2S
      batch-size: 50
      confirm-timeout: PT5S
app:
  auth:
    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET:HK5r8WcYA8J8jo2ruIBCEXRcHhUfSDUqP16H29P1sxo=}
  security:
    public-endpoints:
      - method: GET
        patterns:
          - /actuator/health
          - /actuator/info
          - /v3/api-docs
          - /v3/api-docs/**

springdoc:
  # OpenAPI for the Gateway Swagger UI; set API_DOCS_ENABLED=false outside local development.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/community/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      probes:
        enabled: true
