spring:
  datasource:
    url: ${COMMUNITY_DB_URL:jdbc:postgresql://localhost:5433/community_db}
    username: ${COMMUNITY_DB_USERNAME:postgres}
    password: ${COMMUNITY_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  auth:
    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      probes:
        enabled: true
