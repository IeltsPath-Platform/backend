spring:
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${USER_DB_USERNAME:postgres}
    password: ${USER_DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  auth:
    external-jwt-issuer: ${EXTERNAL_JWT_ISSUER:urn:code-base:auth}
    external-jwt-secret: ${EXTERNAL_JWT_SECRET:FaU24nQz6jxA6m3ihV49zlGXoncSfkNMgYpgC7XPKXc=}
    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET:HK5r8WcYA8J8jo2ruIBCEXRcHhUfSDUqP16H29P1sxo=}
    access-token-max-age-seconds: ${ACCESS_TOKEN_MAX_AGE_SECONDS:3600}
    refresh-token-max-age-seconds: ${REFRESH_TOKEN_MAX_AGE_SECONDS:604800}
    cookie:
      enabled: ${APP_AUTH_COOKIE_ENABLED:true}
      access-token-name: ${APP_AUTH_COOKIE_ACCESS_TOKEN_NAME:access_token}
      access-token-path: ${APP_AUTH_COOKIE_ACCESS_TOKEN_PATH:/}
      refresh-token-name: ${APP_AUTH_COOKIE_REFRESH_TOKEN_NAME:refresh_token}
      refresh-token-path: ${APP_AUTH_COOKIE_REFRESH_TOKEN_PATH:/auth}
      same-site: ${APP_AUTH_COOKIE_SAME_SITE:LAX}
      secure: ${APP_AUTH_COOKIE_SECURE:false}
      http-only: ${APP_AUTH_COOKIE_HTTP_ONLY:true}
  security:
    public-endpoints:
      - method: POST
        patterns:
          - /auth/login
          - /auth/refresh
          - /auth/logout
          - /auth/forgot-password
          - /auth/reset-password
          - /api/users/register

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      probes:
        enabled: true
