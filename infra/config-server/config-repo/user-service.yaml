spring:
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://app-db:5432/app_db}
    username: ${USER_DB_USERNAME:postgres}
    password: ${USER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka/}

app:
  auth:
    external-jwt-issuer: ${EXTERNAL_JWT_ISSUER:urn:code-base:auth}
    external-jwt-secret: ${EXTERNAL_JWT_SECRET}
    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET}
    access-token-max-age-seconds: ${ACCESS_TOKEN_MAX_AGE_SECONDS:3600}
    refresh-token-max-age-seconds: ${REFRESH_TOKEN_MAX_AGE_SECONDS:604800}
  security:
    public-endpoints:
      - method: POST
        patterns:
          - /auth/login
          - /auth/refresh
          - /auth/logout
          - /api/users/register

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      probes:
        enabled: true
