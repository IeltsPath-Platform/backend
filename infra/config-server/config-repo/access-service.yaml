spring:
  datasource:
    url: ${ACCESS_DB_URL:jdbc:postgresql://localhost:5440/access_db}
    username: ${ACCESS_DB_USERNAME:postgres}
    password: ${ACCESS_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${ACCESS_DB_POOL_MAX_SIZE:5}
      minimum-idle: ${ACCESS_DB_POOL_MIN_IDLE:1}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # db/callback holds afterMigrate__demo_data.sql: demo accounts written only when DEMO_DATA_ENABLED=true
    # (dev/demo databases; the password is public).
    locations: classpath:db/migration,classpath:db/callback
    placeholders:
      demoData: ${DEMO_DATA_ENABLED:false}
      # The learner the demo data belongs to: h2 by default; set DEMO_LEARNER_ID to give it to an existing account.
      demoUserId: ${DEMO_LEARNER_ID:00000000-0000-0000-0000-000000000003}
  # Learning sends the points it owes (streak, quests, badges, mastered points) over RabbitMQ; Access answers on the same broker.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

# Outbox relay: publishes SubscriptionGranted events to Notification. Other event types stay in the table only.
access:
  points:
    reconciliation:
      enabled: ${ACCESS_POINTS_RECONCILIATION_ENABLED:false}
      interval: ${ACCESS_POINTS_RECONCILIATION_INTERVAL:PT24H}
      max-rows: ${ACCESS_POINTS_RECONCILIATION_MAX_ROWS:100}
  outbox:
    relay:
      enabled: ${ACCESS_OUTBOX_RELAY_ENABLED:true}
      batch-size: 50
      max-attempts: 20
      poll-interval: PT2S
      confirm-timeout: PT5S
    purge:
      enabled: ${ACCESS_OUTBOX_PURGE_ENABLED:true}
      retention-days: ${ACCESS_OUTBOX_PURGE_RETENTION_DAYS:30}
      batch-size: 1000
      max-batches-per-run: 20
      cron: ${ACCESS_OUTBOX_PURGE_CRON:0 47 3 * * *}
  # The user service lists the sales accounts that keys are handed to (GET /internal/users/sales-staff).
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8085}
  # Base64 of 32 random bytes. Keeps the full code of each batch key encrypted so a sale can look at it again and a manager
  # can export a batch. No default: without it no batch can be made, but keys still activate (activation compares a hash).
  key-code:
    secret: ${ACCESS_KEY_CODE_SECRET:}

app:
  auth:
    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET}
  security:
    public-endpoints:
      - method: GET
        patterns:
          - /actuator/health
          - /actuator/info
          - /v3/api-docs
          - /v3/api-docs/**

springdoc:
  # OpenAPI for the Gateway Swagger UI; set API_DOCS_ENABLED=false outside local development.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/access/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  endpoint:
    health:
      probes:
        enabled: true

