spring:
  datasource:
    url: ${ACCESS_DB_URL:jdbc:postgresql://localhost:5440/access_db}
    username: ${ACCESS_DB_USERNAME:postgres}
    password: ${ACCESS_DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # db/callback holds afterMigrate__demo_data.sql: demo accounts written only when DEMO_DATA_ENABLED=true
    # (dev/demo databases; the password is public).
    locations: classpath:db/migration,classpath:db/callback
    placeholders:
      demoData: ${DEMO_DATA_ENABLED:false}
  # Learning sends the points it owes (streak, quests, badges, mastered points) over RabbitMQ; Access answers on the same broker.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

app:
  auth:
    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET:HK5r8WcYA8J8jo2ruIBCEXRcHhUfSDUqP16H29P1sxo=}
  security:
    public-endpoints:
      - method: GET
        patterns:
          - /actuator/health
          - /actuator/info
          - /v3/api-docs
          - /v3/api-docs/**

springdoc:
  # OpenAPI for the Gateway Swagger UI; set API_DOCS_ENABLED=false outside local development.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/access/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  endpoint:
    health:
      probes:
        enabled: true

