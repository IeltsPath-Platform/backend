server:
  port: ${SERVER_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              # Đích mà Gateway sẽ forward request tới.
              #
              # "lb://" = Load Balancer.
              # Gateway KHÔNG gọi một host/port cố định như:
              # http://localhost:8081
              #
              # Thay vào đó Gateway sẽ tìm service có tên USER-SERVICE
              # thông qua Service Discovery, ví dụ Eureka.
              #
              # Nếu Eureka đang có:
              #
              # USER-SERVICE
              # ├── 10.0.0.11:8081
              # ├── 10.0.0.12:8081
              # └── 10.0.0.13:8081
              #
              # thì Spring Cloud LoadBalancer sẽ chọn một instance phù hợp
              # rồi Gateway forward request tới instance đó.
              #
              # USER-SERVICE phải khớp với service id mà user-service
              # đăng ký lên Eureka, thường đến từ:
              #
              # spring:
              #   application:
              #     name: user-service
              #
              # Eureka thường hiển thị service id ở dạng USER-SERVICE.
              uri: lb://USER-SERVICE
              predicates:
                # Chỉ những request có path match một trong các pattern này
                # mới sử dụng route "user-service".
                #
                # Ví dụ:
                # POST /auth/login
                # GET  /api/users/me
                #
                # đều sẽ được route tới USER-SERVICE.
                - Path=/auth/**,/api/users/**

            - id: access-service
              uri: lb://ACCESS-SERVICE
              predicates:
                - Path=/api/access/**

            - id: library-service
              uri: lb://LIBRARY-SERVICE
              predicates:
                - Path=/api/content/videos/**,/api/content/vocabulary/**,/api/content/admin/vocabulary/**

            - id: content-service
              uri: lb://CONTENT-SERVICE
              predicates:
                - Path=/api/content/**

            - id: assessment-service
              uri: lb://ASSESSMENT-SERVICE
              predicates:
                - Path=/api/assessments/**

            - id: library-personal-service
              uri: lb://LIBRARY-SERVICE
              predicates:
                - Path=/api/learning-support/flashcards/**,/api/learning-support/decks/**,/api/learning-support/notes/**,/api/learning-support/video-progress/**,/api/learning-support/saved-segments/**

            - id: user-activity-streak-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/learning-support/activities/**,/api/learning-support/streak/**

            - id: game-service
              uri: lb://GAME-SERVICE
              predicates:
                - Path=/api/games/**

            - id: game-service-websocket
              uri: lb:ws://GAME-SERVICE
              predicates:
                - Path=/ws/games/**

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**

            - id: community-service
              uri: lb://COMMUNITY-SERVICE
              predicates:
                - Path=/api/community/**

            - id: learning-service
              uri: lb://learning-service
              predicates:
                - Path=/api/learning/**
            # OpenAPI documents of every business service with an API, proxied for the Gateway Swagger UI.
            - id: api-docs-user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api-docs/user-service
              filters:
                - RewritePath=/api-docs/user-service, /v3/api-docs
            - id: api-docs-access-service
              uri: lb://ACCESS-SERVICE
              predicates:
                - Path=/api-docs/access-service
              filters:
                - RewritePath=/api-docs/access-service, /v3/api-docs
            - id: api-docs-assessment-service
              uri: lb://ASSESSMENT-SERVICE
              predicates:
                - Path=/api-docs/assessment-service
              filters:
                - RewritePath=/api-docs/assessment-service, /v3/api-docs
            - id: api-docs-learning-service
              uri: lb://learning-service
              predicates:
                - Path=/api-docs/learning-service
              filters:
                - RewritePath=/api-docs/learning-service, /v3/api-docs
            - id: api-docs-content-service
              uri: lb://CONTENT-SERVICE
              predicates:
                - Path=/api-docs/content-service
              filters:
                - RewritePath=/api-docs/content-service, /v3/api-docs
            - id: api-docs-library-service
              uri: lb://LIBRARY-SERVICE
              predicates:
                - Path=/api-docs/library-service
              filters:
                - RewritePath=/api-docs/library-service, /v3/api-docs
            - id: api-docs-game-service
              uri: lb://GAME-SERVICE
              predicates:
                - Path=/api-docs/game-service
              filters:
                - RewritePath=/api-docs/game-service, /v3/api-docs
            - id: api-docs-community-service
              uri: lb://COMMUNITY-SERVICE
              predicates:
                - Path=/api-docs/community-service
              filters:
                - RewritePath=/api-docs/community-service, /v3/api-docs

app:
  auth:
    external-jwt-issuer: ${EXTERNAL_JWT_ISSUER:urn:code-base:auth}
    external-jwt-secret: ${EXTERNAL_JWT_SECRET:FaU24nQz6jxA6m3ihV49zlGXoncSfkNMgYpgC7XPKXc=}

    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET:HK5r8WcYA8J8jo2ruIBCEXRcHhUfSDUqP16H29P1sxo=}
    internal-token-max-age-seconds: ${INTERNAL_TOKEN_MAX_AGE_SECONDS:60}

    internal-jwt-paths:
      - /api/users
      - /auth/me
      - /api/access
      - /api/content
      - /api/assessments
      - /api/learning-support
      - /api/games
      - /api/notifications
      - /api/community
      - /api/learning

    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

gateway:
  security:
    public-endpoints:
      - /auth/login
      - /auth/refresh
      - /auth/logout
      - /auth/forgot-password
      - /auth/reset-password
      - /api/users/register
      - /ws/games/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /api-docs/**
      - /webjars/**

springdoc:
  # Swagger UI for every business service; set API_DOCS_ENABLED=false outside local development.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    urls:
      - name: user-service
        url: /api-docs/user-service
      - name: access-service
        url: /api-docs/access-service
      - name: assessment-service
        url: /api-docs/assessment-service
      - name: learning-service
        url: /api-docs/learning-service
      - name: content-service
        url: /api-docs/content-service
      - name: library-service
        url: /api-docs/library-service
      - name: game-service
        url: /api-docs/game-service
      - name: community-service
        url: /api-docs/community-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,refresh
