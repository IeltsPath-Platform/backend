spring:
  datasource:
    url: ${CONTENT_DB_URL:jdbc:postgresql://localhost:5432/content_db}
    username: ${CONTENT_DB_USERNAME:postgres}
    password: ${CONTENT_DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

content:
  media:
    # Public https prefix of the bucket holding audio keys such as listening/demo/ls1.mp3; blank = keys cannot resolve.
    base-url: ${CONTENT_MEDIA_BASE_URL:}

app:
  auth:
    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET:HK5r8WcYA8J8jo2ruIBCEXRcHhUfSDUqP16H29P1sxo=}
  security:
    public-endpoints:
      - method: GET
        patterns:
          - /actuator/health
          - /actuator/info
          - /v3/api-docs
          - /v3/api-docs/**

springdoc:
  # OpenAPI for the Gateway Swagger UI; set API_DOCS_ENABLED=false outside local development.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/content/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      probes:
        enabled: true

