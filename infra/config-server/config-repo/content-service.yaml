spring:
  datasource:
    url: ${CONTENT_DB_URL:jdbc:postgresql://localhost:5440/content_db}
    username: ${CONTENT_DB_USERNAME:postgres}
    password: ${CONTENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${CONTENT_DB_POOL_MAX_SIZE:5}
      minimum-idle: ${CONTENT_DB_POOL_MIN_IDLE:1}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Renumbered migrations: db/callback/beforeValidate.sql moves their history rows, and the numbers that were never
    # run on an older developer database then have to be applied out of order.
    out-of-order: true
    locations: classpath:db/migration,classpath:db/callback
  servlet:
    multipart:
      # Audio upload for authors: 25 MB file, a little headroom for the multipart envelope.
      max-file-size: 25MB
      max-request-size: 26MB

content:
  # Library service that owns vocabulary senses; Content resolves and creates words there while authors write lessons.
  library:
    base-url: ${LIBRARY_SERVICE_URL:http://localhost:8081}
  # Access service that answers whether the learner has Premium, for premium practice tests.
  access:
    base-url: ${ACCESS_SERVICE_URL:http://localhost:8084}
  media:
    # Public https prefix of the bucket holding audio keys such as listening/demo/ls1.mp3; blank = keys cannot resolve.
    base-url: ${CONTENT_MEDIA_BASE_URL:}
    # Bucket that author uploads go to; new files live under content-audio/ so seeded files are never overwritten.
    bucket: ${CONTENT_MEDIA_BUCKET:media}
    premium-bucket: ${CONTENT_PREMIUM_MEDIA_BUCKET:media-premium}
    premium-url-ttl-seconds: 900
  # Language model for AI drafts (OpenAI-compatible). Blank values mean drafts fail with NOT_CONFIGURED; the rest of the
  # service still starts. Keys live only in the gitignored .env file. A CONTENT_LLM_* value wins; when it is not set the
  # learning service's LEARNING_LLM_* value is used, so one model configuration serves both.
  llm:
    base-url: ${CONTENT_LLM_BASE_URL:${LEARNING_LLM_BASE_URL:}}
    api-key: ${CONTENT_LLM_API_KEY:${LEARNING_LLM_API_KEY:}}
    model: ${CONTENT_LLM_MODEL:${LEARNING_LLM_MODEL:}}
    reasoning-effort: ${CONTENT_LLM_REASONING_EFFORT:${LEARNING_LLM_REASONING_EFFORT:}}
    max-tokens: ${CONTENT_LLM_MAX_TOKENS:${LEARNING_LLM_MAX_TOKENS:8192}}
  ai:
    batch-size: 2
    stale-after: PT10M
    max-attempts: 3
    daily-limit: 20
    max-items-per-request: 20
    quota-zone: Asia/Ho_Chi_Minh
    section-questions:
      min-source-words: 80
      max-source-chars: 20000
      max-count: 10
      duplicate-threshold: 0.8
      same-answer-threshold: 0.5
      max-answer-words: 4
      max-copied-words: 12
      max-stem-chars: 400
      ready-ttl: P14D

app:
  storage:
    # Missing SUPABASE_URL and SUPABASE_SECRET_KEY: the service still starts and audio upload answers 503.
    enabled: true
    supabase:
      url: ${SUPABASE_URL:}
      secret-key: ${SUPABASE_SECRET_KEY:}
      # The default of 3 s is shorter than a slow TLS handshake to Supabase from some networks, which fails an
      # upload as STORAGE_UNAVAILABLE before any byte is sent. The upload itself keeps its own 120 s limit.
      connect-timeout: ${CONTENT_STORAGE_CONNECT_TIMEOUT:10s}
  auth:
    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET}
  security:
    public-endpoints:
      - method: GET
        patterns:
          - /actuator/health
          - /actuator/info
          - /v3/api-docs
          - /v3/api-docs/**

springdoc:
  # OpenAPI for the Gateway Swagger UI; set API_DOCS_ENABLED=false outside local development.
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  paths-to-match:
    - /api/content/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  endpoint:
    health:
      probes:
        enabled: true
