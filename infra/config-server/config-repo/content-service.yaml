spring:
  datasource:
    url: ${CONTENT_DB_URL:jdbc:postgresql://localhost:5432/content_db}
    username: ${CONTENT_DB_USERNAME:postgres}
    password: ${CONTENT_DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      # Audio upload for authors: 25 MB file, a little headroom for the multipart envelope.
      max-file-size: 25MB
      max-request-size: 26MB

content:
  media:
    # Public https prefix of the bucket holding audio keys such as listening/demo/ls1.mp3; blank = keys cannot resolve.
    base-url: ${CONTENT_MEDIA_BASE_URL:}
    # Bucket that author uploads go to; new files live under content-audio/ so seeded files are never overwritten.
    bucket: ${CONTENT_MEDIA_BUCKET:media}
  # Language model for AI drafts (OpenAI-compatible). Blank values mean drafts fail with NOT_CONFIGURED; the rest of the
  # service still starts. Keys live only in the gitignored .env file.
  llm:
    base-url: ${CONTENT_LLM_BASE_URL:}
    api-key: ${CONTENT_LLM_API_KEY:}
    model: ${CONTENT_LLM_MODEL:}
  ai:
    batch-size: 2
    stale-after: PT10M
    daily-limit: 20
    max-items-per-request: 20
    max-course-candidates: 40
    quota-zone: Asia/Ho_Chi_Minh

app:
  storage:
    # Missing SUPABASE_URL and SUPABASE_SECRET_KEY: the service still starts and audio upload answers 503.
    enabled: true
    supabase:
      url: ${SUPABASE_URL:}
      secret-key: ${SUPABASE_SECRET_KEY:}
  auth:
    internal-jwt-issuer: ${INTERNAL_JWT_ISSUER:urn:code-base:api-gateway}
    internal-jwt-secret: ${GATEWAY_INTERNAL_JWT_SECRET:HK5r8WcYA8J8jo2ruIBCEXRcHhUfSDUqP16H29P1sxo=}
  security:
    public-endpoints:
      - method: GET
        patterns:
          - /actuator/health
          - /actuator/info
          - /v3/api-docs
          - /v3/api-docs/**

springdoc:
  # OpenAPI for the Gateway Swagger UI; set API_DOCS_ENABLED=false outside local development.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  paths-to-match:
    - /api/content/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      probes:
        enabled: true

