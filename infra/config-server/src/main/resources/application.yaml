server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: config-server

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:native}

  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_NATIVE_REPO_URI:file:./infra/config-server/config-repo,file:./config-repo,file:../config-repo}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
